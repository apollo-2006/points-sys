<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SEASON 1 · BATTLE FOR THE TOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07080B;
    --panel:#14171D;
    --panel-light:#1C2028;
    --glass:rgba(24,27,34,0.58);
    --glass-light:rgba(255,255,255,0.035);
    --border:#272C35;
    --border-glass:rgba(255,255,255,0.09);
    --flame:#FF5A1F;
    --flame-dim:#7A2E14;
    --cyan:#3EC6E0;
    --purple:#B463FF;
    --gold:#FFC94A;
    --white-evo:#E9ECEF;
    --text:#EDEFF2;
    --text-muted:#868C96;
    --danger:#FF5252;
    --success:#4CD97B;
    /* identity colors — Abir is always red, Jade is always green */
    --abir-deep:#722F37;
    --abir-accent:#FF4D5E;
    --jade-deep:#004700;
    --jade-accent:#3ECF6E;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--void);
    background-image:
      radial-gradient(ellipse 1000px 600px at 10% -10%, rgba(255,90,31,0.14), transparent 60%),
      radial-gradient(ellipse 800px 600px at 105% 10%, rgba(180,99,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 40% 110%, rgba(62,198,224,0.08), transparent 60%),
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:auto,auto,auto,44px 44px,44px 44px;
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    position:relative;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,90,31,0.06), transparent 70%);
    animation:ambient-drift 16s ease-in-out infinite alternate;
  }
  @keyframes ambient-drift{
    0%{ opacity:0.6; transform:translateY(0); }
    100%{ opacity:1; transform:translateY(20px); }
  }
  ::selection{background:var(--flame);color:#0A0C0F;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--void);}
  ::-webkit-scrollbar-thumb{background:var(--panel-light);border-radius:5px;border:2px solid var(--void);}
  ::-webkit-scrollbar-thumb:hover{background:var(--flame-dim);}

  .wrap{max-width:1360px;margin:0 auto;padding:24px 16px 60px;position:relative;z-index:1;}

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--border-glass);padding-bottom:18px;margin-bottom:18px;
    gap:12px;flex-wrap:wrap;position:relative;
  }
  .topbar::after{
    content:'';position:absolute;bottom:-1px;left:0;width:140px;height:1px;
    background:linear-gradient(90deg,var(--flame),transparent);
  }
  .brand-eyebrow{
    font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:4px;
    color:var(--flame);text-transform:uppercase;
    text-shadow:0 0 12px rgba(255,90,31,0.5);
  }
  h1{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(26px,5vw,38px);
    margin:4px 0 0;letter-spacing:1px;text-transform:uppercase;
    background:linear-gradient(100deg,#fff 10%,var(--flame) 55%,var(--gold) 90%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,90,31,0.25));
  }
  .ranking-tag{
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border-glass);border-left:3px solid var(--lead-color,var(--border));
    padding:9px 20px;min-width:190px;text-align:right;
    clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);
    box-shadow:0 4px 20px rgba(0,0,0,0.35);
  }
  .lead-eyebrow{
    font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;
    color:var(--text-muted);text-transform:uppercase;
  }
  .lead-name{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.5px;
    text-transform:uppercase;line-height:1.25;
  }
  .lead-diff{
    font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-muted);margin-top:1px;
  }

  .shared-note{
    font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-muted);
    background:var(--glass-light);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px dashed var(--border-glass);padding:9px 14px;margin-bottom:22px;border-radius:3px;
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;
  }
  .shared-note b{color:var(--cyan);}

  /* ---------- EVO BANNERS ---------- */
  .banners{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
  @media (max-width:560px){.banners{grid-template-columns:1fr;}}

  .banner{
    position:relative;
    background:linear-gradient(160deg,var(--glass-light),var(--glass));
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border-glass);border-left:3px solid var(--id-color,var(--border-glass));
    padding:20px 20px 18px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);
    overflow:hidden;transition:transform .22s ease,box-shadow .22s ease;
    box-shadow:0 8px 28px rgba(0,0,0,0.3);
  }
  .banner:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,0,0,0.45),0 0 30px -12px var(--id-color,transparent);}
  .banner::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--tier-color,var(--cyan));
    box-shadow:0 0 16px var(--tier-color,var(--cyan));
  }
  .banner::after{
    content:'';position:absolute;top:-60%;left:-20%;width:60%;height:220%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,0.06),transparent);
    transform:rotate(15deg);transition:left 1.1s ease;pointer-events:none;
  }
  .banner:hover::after{left:120%;}
  .banner-head{display:flex;justify-content:space-between;align-items:center;}
  .banner-name{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:21px;letter-spacing:0.5px;
    cursor:pointer;text-transform:uppercase;transition:color .15s ease;
  }
  .banner-name:hover{color:var(--flame);}
  .crown{
    display:inline-block;margin-right:6px;font-size:16px;
    filter:drop-shadow(0 0 4px rgba(255,201,74,0.7));
    animation:crown-bob 2.2s ease-in-out infinite;
  }
  @keyframes crown-bob{
    0%,100%{ transform:translateY(0) rotate(-6deg); }
    50%{ transform:translateY(-2px) rotate(6deg); }
  }
  .evo-hex{
    width:36px;height:36px;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    background:linear-gradient(160deg,var(--tier-color,var(--cyan)),rgba(255,255,255,0.3));
    display:flex;align-items:center;justify-content:center;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:#0A0C0F;
    box-shadow:0 0 18px var(--tier-color,var(--cyan));
  }
  .banner-points{
    font-family:'Share Tech Mono',monospace;font-size:34px;font-weight:700;margin:12px 0 2px;
    letter-spacing:1px;text-shadow:0 0 20px rgba(255,255,255,0.08);
  }
  .banner-tier-label{
    font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-muted);
    letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;
  }
  .evo-track{height:6px;background:rgba(0,0,0,0.5);border:1px solid var(--border-glass);position:relative;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,0.7);border-radius:3px;}
  .evo-fill{height:100%;background:linear-gradient(90deg,var(--tier-color,var(--cyan)),rgba(255,255,255,0.5));transition:width .6s ease;
    box-shadow:0 0 10px var(--tier-color,var(--cyan));border-radius:3px;}

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;position:relative;
    background:var(--glass-light);border:1px solid var(--border-glass);padding:5px;border-radius:4px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .tab-btn{
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:1px;
    text-transform:uppercase;background:transparent;border:1px solid transparent;
    color:var(--text-muted);padding:9px 16px;cursor:pointer;border-radius:3px;
    transition:all .18s ease;position:relative;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{
    background:linear-gradient(135deg,var(--flame),#ff7e45);color:#0A0C0F;
    box-shadow:0 4px 16px rgba(255,90,31,0.45);
  }

  /* ---------- CONTENT ---------- */
  .panel-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin:24px 0 12px;}
  .panel-title:first-child{margin-top:0;}
  .col2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:640px){.col2{grid-template-columns:1fr;}}

  .card{
    background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border-glass);border-left:2px solid transparent;
    padding:13px 15px;margin-bottom:9px;border-radius:4px;
    display:flex;flex-direction:column;align-items:stretch;gap:8px;
    transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .card:hover{border-color:var(--border-glass);border-left-color:var(--flame);transform:translateX(2px);box-shadow:0 6px 20px rgba(0,0,0,0.28);}
  .card-info{flex:1;min-width:150px;}
  .card-label{font-size:14px;font-weight:500;}
  .card-pts{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text-muted);margin-top:2px;}
  .card-pts.neg{color:var(--danger);}
  .card-pts.pos{color:var(--success);}
  .card-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

  .pill{
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:0.5px;
    text-transform:uppercase;border:1px solid var(--border-glass);background:var(--glass-light);
    color:var(--text);padding:7px 13px;cursor:pointer;transition:all .14s ease;border-radius:3px;
  }
  .pill:hover:not(:disabled){border-color:var(--flame);color:var(--flame);box-shadow:0 0 12px rgba(255,90,31,0.25);}
  .pill:active:not(:disabled){transform:scale(0.94);}
  .pill:disabled{opacity:0.32;cursor:not-allowed;}
  .pill.abir{border-color:var(--abir-deep);}
  .pill.abir:hover:not(:disabled){border-color:var(--abir-accent);color:var(--abir-accent);box-shadow:0 0 12px rgba(255,77,94,0.3);}
  .pill.jade{border-color:var(--jade-deep);}
  .pill.jade:hover:not(:disabled){border-color:var(--jade-accent);color:var(--jade-accent);box-shadow:0 0 12px rgba(62,207,110,0.3);}
  .pill.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger);box-shadow:0 0 12px rgba(255,82,82,0.3);}
  .pill.ghost{background:none;color:var(--text-muted);padding:7px 9px;font-size:14px;}
  .pill.ghost:hover:not(:disabled){color:var(--danger);border-color:var(--danger);}

  .card-remove-btn{
    background:none;border:1px solid transparent;color:var(--text-muted);
    padding:6px 9px;font-size:14px;cursor:pointer;border-radius:3px;
    opacity:0.28;transition:opacity .15s ease,color .15s ease,border-color .15s ease;
  }
  .card:hover .card-remove-btn{opacity:1;}
  .card-remove-btn:hover{color:var(--danger);border-color:var(--danger);opacity:1;}

  .layout{display:grid;grid-template-columns:250px 1fr 250px;gap:20px;align-items:start;}
  .main-col{min-width:0;}
  .side-col{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px;}
  @media (max-width:1000px){
    .layout{grid-template-columns:1fr;}
    .main-col{order:1;}
    .side-col{position:static;}
    .side-col.left{order:2;}
    .side-col.right{order:3;}
  }

  .side-panel{
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border-glass);border-top:2px solid var(--flame);padding:15px;
    border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  .side-panel-title{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;
    text-transform:uppercase;color:var(--text);margin-bottom:2px;
  }
  .side-panel-sub{
    font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-muted);
    margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border-glass);
  }
  .side-group{margin-bottom:12px;}
  .side-group:last-child{margin-bottom:0;}
  .side-group-name{
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:0.5px;
    text-transform:uppercase;color:var(--text);margin-bottom:6px;
  }
  .side-item{
    display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:5px 0;
    border-bottom:1px solid var(--border-glass);
  }
  .side-item:last-child{border-bottom:none;}
  .side-item-label{color:var(--text-muted);}
  .side-item-delta{font-family:'Share Tech Mono',monospace;font-weight:600;white-space:nowrap;}
  .side-item-delta.pos{color:var(--success);}
  .side-item-delta.neg{color:var(--danger);}

  .todo-row{
    display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:6px 0;
    border-bottom:1px solid var(--border-glass);cursor:pointer;
  }
  .todo-row:last-of-type{border-bottom:none;}
  .todo-row input[type="checkbox"]{margin-top:2px;accent-color:var(--flame);cursor:pointer;}

  @keyframes confetti-fall{
    0%{ transform: translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform: translate(var(--drift,0),115vh) rotate(600deg); opacity:0.4; }
  }

  .count-tag{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-muted);}

  .empty-note{color:var(--text-muted);font-size:13px;font-style:italic;padding:10px 2px;}

  /* forms */
  .bet-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .bet-form input{
    background:var(--glass-light);border:1px solid var(--border-glass);color:var(--text);
    padding:9px 10px;font-family:'Inter',sans-serif;font-size:13px;flex:1;min-width:120px;
    border-radius:3px;transition:border-color .15s ease;
  }
  .bet-form input:focus{outline:none;border-color:var(--flame);box-shadow:0 0 0 3px rgba(255,90,31,0.15);}
  .btn-flame{
    font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    background:linear-gradient(135deg,var(--flame),#ff7e45);color:#0A0C0F;border:none;padding:9px 18px;cursor:pointer;
    border-radius:3px;transition:all .15s ease;box-shadow:0 3px 12px rgba(255,90,31,0.3);
  }
  .btn-flame:hover{filter:brightness(1.1);box-shadow:0 5px 18px rgba(255,90,31,0.45);transform:translateY(-1px);}
  .btn-flame:active{transform:translateY(0);}

  /* history */
  .hist-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-glass);font-size:13px;}
  .hist-meta{color:var(--text-muted);font-family:'Share Tech Mono',monospace;font-size:11px;}
  .hist-delta{font-family:'Share Tech Mono',monospace;font-weight:600;white-space:nowrap;}

  .top-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;}
  .link-btn{background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;text-decoration:underline;font-family:'Inter',sans-serif;}
  .link-btn:hover{color:var(--flame);}

  .num-input{width:70px;background:var(--glass-light);border:1px solid var(--border-glass);color:var(--text);padding:6px;font-family:'Share Tech Mono',monospace;font-size:12px;border-radius:3px;}

  /* collapsible add-forms — keeps lists tidy until you actually want to add something */
  .add-details{margin-top:10px;}
  .add-details summary{
    list-style:none;cursor:pointer;user-select:none;
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:0.5px;
    text-transform:uppercase;color:var(--text-muted);
    border:1px dashed var(--border-glass);padding:8px 14px;border-radius:3px;
    transition:all .15s ease;display:inline-block;
  }
  .add-details summary::-webkit-details-marker{display:none;}
  .add-details summary:hover{color:var(--flame);border-color:var(--flame-dim);}
  .add-details[open] summary{color:var(--flame);border-color:var(--flame-dim);margin-bottom:2px;}

  /* ---------- THOUGHT BOARDS ---------- */
  .board-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .board-tab{
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.5px;
    text-transform:uppercase;background:var(--glass-light);border:1px solid var(--border-glass);
    color:var(--text-muted);padding:7px 14px;cursor:pointer;border-radius:3px;transition:all .15s ease;
  }
  .board-tab:hover{color:var(--text);border-color:var(--flame-dim);}
  .board-tab.active{background:linear-gradient(135deg,var(--flame),#ff7e45);color:#0A0C0F;border-color:transparent;box-shadow:0 3px 12px rgba(255,90,31,0.35);}

  .sticky-board{column-count:3;column-gap:16px;}
  @media (max-width:900px){.sticky-board{column-count:2;}}
  @media (max-width:600px){.sticky-board{column-count:1;}}

  .sticky-note{
    display:inline-block;width:100%;break-inside:avoid;margin-bottom:16px;
    border-radius:2px;padding:14px 14px 10px;position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,0.35),0 1px 0 rgba(255,255,255,0.15) inset;
    transform:rotate(var(--tilt,0deg));transition:transform .15s ease,box-shadow .15s ease;
    color:#14171D;
  }
  .sticky-note:nth-child(3n+1){--tilt:-1.2deg;}
  .sticky-note:nth-child(3n+2){--tilt:0.8deg;}
  .sticky-note:nth-child(3n+3){--tilt:-0.4deg;}
  .sticky-note:hover{transform:rotate(0deg) translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,0.45),0 1px 0 rgba(255,255,255,0.15) inset;}
  .sticky-note:hover .card-remove-btn{opacity:1;}
  .sticky-note-text{
    width:100%;min-height:70px;background:transparent;border:none;resize:vertical;
    font-family:'Inter',sans-serif;font-size:13.5px;color:#14171D;padding:0;margin-bottom:8px;
  }
  .sticky-note-text:focus{outline:none;}
  .sticky-note-swatches{display:flex;gap:5px;margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <div class="brand-eyebrow">Season 1 · Fall 26</div>
      <h1>Battle For The Top</h1>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
      <div class="ranking-tag" id="rankingTag">Loading ranking…</div>
      <div id="authStatus" style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-muted);"></div>
    </div>
  </div>

  <div class="shared-note">
    <span><b>Live shared board.</b> Backed by a real database — open this page from either of your phones or laptops and you'll both see the same points update instantly.</span>
  </div>

  <div id="setupGate" style="display:none;"></div>

  <div id="loginGate" style="display:none;max-width:360px;margin:40px auto;">
    <div class="card" style="display:block;">
      <div class="panel-title" style="margin-top:0;">Sign in</div>
      <input id="loginEmail" type="email" placeholder="Email" class="bet-form-input" style="width:100%;margin-bottom:8px;background:var(--panel-light);border:1px solid var(--border);color:var(--text);padding:9px 10px;font-family:'Inter',sans-serif;font-size:13px;">
      <input id="loginPassword" type="password" placeholder="Password" style="width:100%;margin-bottom:10px;background:var(--panel-light);border:1px solid var(--border);color:var(--text);padding:9px 10px;font-family:'Inter',sans-serif;font-size:13px;">
      <button class="btn-flame" style="width:100%;" onclick="__auth.signIn()">Sign In</button>
      <div id="loginError" style="color:var(--danger);font-size:12px;margin-top:8px;"></div>
    </div>
  </div>

  <div id="app" style="display:none;" class="layout">
    <aside class="side-col left" id="todayCol"></aside>

    <main class="main-col">
      <div class="banners" id="banners"></div>

      <div class="tabs" id="tabs">
        <button class="tab-btn" data-tab="daily">Daily</button>
        <button class="tab-btn" data-tab="achievements">Achievements</button>
        <button class="tab-btn" data-tab="quests">Quest Log</button>

function mergeState(parsed){
  const d = defaultState();
  state = Object.assign(d, parsed);

  state.counts = Object.assign({abir:{},jade:{}}, parsed.counts||{});

function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function getCountToday(party, key){
  const c = state.counts[party][key];
  if(!c || c.date !== todayKey()) return 0;
  return c.n;
}

function bumpCount(party, key){
  const day = todayKey();
  const c = state.counts[party][key];
  if(c && c.date === day){ c.n += 1; }
  else{ state.counts[party][key] = {date: day, n: 1}; }
}

function dropCount(party, key){
  const day = todayKey();
  const c = state.counts[party][key];
  if(c && c.date === day && c.n > 0){ c.n -= 1; }
}

let applyingRemote = false;

function subscribeState(){
  onSnapshot(stateRef, (snap)=>{
    applyingRemote = true;
    if(snap.exists()){
      mergeState(snap.data());
    } else {
      state = defaultState();
      setDoc(stateRef, state).catch(e=>console.error('init write failed', e));
    }
    renderAll();
    applyingRemote = false;
  }, (err)=>{
    console.error('listen failed', err);
    document.getElementById('content').innerHTML =
      '<div class="empty-note">Could not reach the database. Double-check your Firebase config and Firestore security rules.</div>';
  });
}

async function saveState(){
  if(applyingRemote) return;
  try{
    await setDoc(stateRef, state);
  }catch(e){
    console.error('save failed', e);
  }
}

function fmt(n){
  const sign = n < 0 ? '-' : (n > 0 ? '+' : '');
  return sign + Math.abs(n).toLocaleString();
}

function tierInfo(points){
  const idx = Math.max(0, Math.floor(points / TIER_SPAN));
  const color = TIER_COLORS[idx % 4];
  const name = TIER_NAMES[idx % 4];
  const level = idx + 1;
  const progress = ((points % TIER_SPAN) + TIER_SPAN) % TIER_SPAN / TIER_SPAN;
  return {color, name, level, progress};
}

function addHistory(party, delta, reason, key){
  state.history.unshift({ts: Date.now(), party, delta, reason, key});
  if(state.history.length > 400) state.history.length = 400;
}

function claim(key, party, delta, reason){
  state.points[party] = (state.points[party]||0) + delta;
  bumpCount(party, key);
  addHistory(party, delta, reason, key);
  saveState();
  renderAll();
}

function undoLast(key, party){
  const idx = state.history.findIndex(h=>h.party===party && h.key===key);
  if(idx===-1) return;
  const entry = state.history[idx];
  state.points[party] = (state.points[party]||0) - entry.delta;
  dropCount(party, key);
  state.history.splice(idx,1);
  saveState();
  renderAll();
}

  if(cost != null){

      alert((state.names[party]||party) + " doesn't have enough points for this yet.");
      return;
    }
    claim('shop:'+id, party, -cost, 'Redeemed: '+item.label);
  } else {
    claim('shop:'+id, party, 0, 'Claimed: '+item.label);
  }
}

function fireConfetti(winnerParty){
  const palette = winnerParty === 'abir'
    ? ['#3EC6E0', '#FF5A1F', '#E9ECEF']  // Abir: cyan + flame
    : ['#FFC94A', '#FF5A1F', '#E9ECEF']; // Jade: gold + flame
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;';
  document.body.appendChild(container);
  const count = 90;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    const color = palette[Math.floor(Math.random()*palette.length)];
    const w = 6 + Math.random()*6;
    const h = w * (0.4 + Math.random()*0.5);
    const left = Math.random()*100;
    const duration = 2.2 + Math.random()*1.6;
    const delay = Math.random()*0.5;
    const rotate = Math.random()*360;
    const drift = (Math.random()*80 - 40).toFixed(0);
    el.style.cssText = `position:absolute;top:-24px;left:${left}vw;width:${w}px;height:${h}px;`
      + `background:${color};opacity:0.95;border-radius:1px;`
      + `transform:rotate(${rotate}deg);`
      + `animation:confetti-fall ${duration}s cubic-bezier(.25,.46,.45,.94) ${delay}s forwards;`
      + `--drift:${drift}px;`;
    container.appendChild(el);
  }
  setTimeout(()=>container.remove(), 4200);
}

function cleanupOrphanedBetHistory(){
  const validBetIds = new Set(state.bets.map(b=>b.id));
  const before = state.history.length;
  state.history = state.history.filter(h=>{
    // old buggy "Reverted bet: ..." lines should never have stuck around — always drop these
    if(h.reason && h.reason.indexOf('Reverted bet:') === 0) return false;
    // "Bet won/lost" entries whose bet was since reverted/deleted are orphaned — drop these too
    if(h.key && h.key.indexOf('bet:') === 0){
      const betId = h.key.slice(4);
      if(!validBetIds.has(betId)) return false;
    }
    return true;
  });
  return before - state.history.length;
}

function renderBanners(){
  const el = document.getElementById('banners');
  const leaderParty = state.points.abir === state.points.jade ? null : (state.points.abir > state.points.jade ? 'abir' : 'jade');
  el.innerHTML = ['abir','jade'].map(p=>{
    const pts = state.points[p];
    const t = tierInfo(pts);
    const crown = p===leaderParty ? '<span class="crown" title="Season lead">👑</span>' : '';
    const idColor = p==='abir' ? 'var(--abir-accent)' : 'var(--jade-accent)';
    return `
    <div class="banner" style="--tier-color:${t.color};--id-color:${idColor}">
      <div class="banner-head">
        <div class="banner-name" onclick="__app.renameParty('${p}')">${crown}${state.names[p]}</div>
        <div class="evo-hex">${t.level}</div>
      </div>
      <div class="banner-points">${pts.toLocaleString()}</div>
      <div class="banner-tier-label">${t.name} Evo · Tier ${t.level}</div>
      <div class="evo-track"><div class="evo-fill" style="width:${(t.progress*100).toFixed(1)}%"></div></div>
    </div>`;
  }).join('');

  const a = state.points.abir, j = state.points.jade;
  const rt = document.getElementById('rankingTag');
  if(a===j){
    rt.style.setProperty('--lead-color', 'var(--border)');
    rt.innerHTML = `<div class="lead-eyebrow">Season Lead</div><div class="lead-name">Dead Even</div>`;
  } else{
    const abirLeads = a>j;
    const leader = abirLeads ? state.names.abir : state.names.jade;
    const diff = Math.abs(a-j);
    const color = abirLeads ? '#FF4D5E' : '#3ECF6E';
    rt.style.setProperty('--lead-color', color);
    rt.innerHTML = `<div class="lead-eyebrow">Season Lead</div><div class="lead-name" style="color:${color}">${leader}</div><div class="lead-diff">+${diff.toLocaleString()} ahead</div>`;
  }
}

function claimCard(key, label, pts, note, removeAction, prereqKey, prereqLabel){
  const cA = getCountToday('abir', key);

  const ptsClass = pts>0?'pos':(pts<0?'neg':'');
  const removeAttr = removeAction ? ` data-remove="${removeAction.replace(/"/g,'&quot;')}"` : '';
  const removeCls = removeAction ? ' removable' : '';
  const abirLocked = prereqKey && getCountToday('abir', prereqKey) === 0;
  const jadeLocked = prereqKey && getCountToday('jade', prereqKey) === 0;
  const lockNote = prereqKey ? `<div style="font-family:'Share Tech Mono',monospace;font-size:10.5px;color:var(--text-muted);margin-top:2px;">Requires "${prereqLabel}" first (today)</div>` : '';

    <div class="card-info">
      <div class="card-label">${label}</div>
      <div class="card-pts ${ptsClass}">${fmt(pts)} pts${note?(' · '+note):''}</div>
      ${lockNote}

function runRemove(call){

  if(!confirm('Remove this item?')) return;
  (0, eval)(call);
}

document.addEventListener('click', e=>{
  const btn = e.target.closest('.card-remove-btn');

});

/* ---------------- daily leaderboard ---------------- */

function todayTotals(){
  const day = todayKey();
  const totals = {abir:0, jade:0};
  state.history.forEach(h=>{
    const d = new Date(h.ts);
    const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    if(key === day && totals[h.party] !== undefined){
      totals[h.party] += h.delta;
    }
  });
  return totals;
}

function getWeekStart(){
  const now = new Date();
  const dow = now.getDay(); // 0=Sun..6=Sat
  const offset = (dow + 6) % 7; // days since most recent Monday
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - offset);
  start.setHours(0,0,0,0);
  return start;
}

function weekDayTotals(){
  const start = getWeekStart();
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    days.push(d);
  }
  const totals = days.map(()=>({abir:0, jade:0}));
  state.history.forEach(h=>{
    const d = new Date(h.ts);
    for(let i=0;i<7;i++){
      const dayStart = days[i];
      const dayEnd = new Date(dayStart);
      dayEnd.setDate(dayStart.getDate()+1);
      if(d >= dayStart && d < dayEnd && totals[i][h.party] !== undefined){
        totals[i][h.party] += h.delta;
      }
    }
  });
  return {days, totals};
}

function lineChartSvg(days, series, color, name, weekTotal){
  const w = 340, h = 210, padL = 8, padR = 8, padT = 20, padB = 26;
  const usableW = w - padL - padR, usableH = h - padT - padB;
  const n = series.length;
  const maxAbs = Math.max(500, ...series.map(v=>Math.abs(v)));
  const baseline = padT + usableH/2;
  const stepX = usableW/(n-1);
  const todayStr = new Date().toDateString();

  const points = series.map((v,i)=>{
    const x = padL + stepX*i;
    const y = baseline - (v/maxAbs)*(usableH/2);
    return {x,y,v};
  });

  const pathD = points.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaD = pathD
    + ` L ${points[n-1].x.toFixed(1)},${baseline.toFixed(1)}`
    + ` L ${points[0].x.toFixed(1)},${baseline.toFixed(1)} Z`;

  const dots = points.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${color}" stroke="#0A0C0F" stroke-width="1.5"/>`).join('');
  const dayLabels = days.map((d,i)=>{
    const isToday = d.toDateString() === todayStr;
    const lab = d.toLocaleDateString(undefined,{weekday:'short'});
    return `<text x="${points[i].x.toFixed(1)}" y="${h-6}" font-family="Share Tech Mono, monospace" font-size="10" fill="${isToday?'#EDEFF2':'#868C96'}" text-anchor="middle">${lab}${isToday?' •':''}</text>`;
  }).join('');

  return `
    <div style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:${color};">${name}</div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:6px;">${fmt(weekTotal)} this week</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
      <line x1="${padL}" y1="${baseline.toFixed(1)}" x2="${w-padR}" y2="${baseline.toFixed(1)}" stroke="#272C35" stroke-width="1"/>
      <path d="${areaD}" fill="${color}" opacity="0.14" stroke="none"/>
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 3px ${color}99);"/>
      ${dots}
      ${dayLabels}
    </svg>
  `;
}

function weekTotalsForRange(start, end){
  const totals = {abir:0, jade:0};
  state.history.forEach(h=>{
    const d = new Date(h.ts);
    if(d >= start && d < end && totals[h.party] !== undefined){
      totals[h.party] += h.delta;
    }
  });
  return totals;
}

function renderWeekly(){
  const {days, totals} = weekDayTotals();
  const abirSeries = totals.map(t=>t.abir);
  const jadeSeries = totals.map(t=>t.jade);
  const weekTotalAbir = abirSeries.reduce((s,v)=>s+v,0);
  const weekTotalJade = jadeSeries.reduce((s,v)=>s+v,0);

  const ABIR_COLOR = '#FF4D5E'; // Abir identity red
  const JADE_COLOR = '#3ECF6E'; // Jade identity green

  // previous week — auto-decided winner, computed fresh from the log every time (no manual step needed)
  const thisWeekStart = getWeekStart();
  const prevWeekStart = new Date(thisWeekStart);
  prevWeekStart.setDate(prevWeekStart.getDate() - 7);
  const prevWeekEnd = thisWeekStart;
  const prevTotals = weekTotalsForRange(prevWeekStart, prevWeekEnd);
  const prevRangeLabel = prevWeekStart.toLocaleDateString(undefined,{month:'short',day:'numeric'})
    + ' – ' + new Date(prevWeekEnd.getTime()-86400000).toLocaleDateString(undefined,{month:'short',day:'numeric'});

  let prevSummary;
  if(prevTotals.abir === 0 && prevTotals.jade === 0){
    prevSummary = `<div class="empty-note" style="padding:0;">No activity logged that week.</div>`;
  } else if(prevTotals.abir === prevTotals.jade){
    prevSummary = `<div style="font-family:'Share Tech Mono',monospace;font-size:13px;">Dead even at ${fmt(prevTotals.abir)} each — no winner.</div>`;
  } else {
    const abirWon = prevTotals.abir > prevTotals.jade;
    const winner = abirWon ? state.names.abir : state.names.jade;
    const color = abirWon ? ABIR_COLOR : JADE_COLOR;
    const diff = Math.abs(prevTotals.abir - prevTotals.jade);
    prevSummary = `<div style="font-family:'Share Tech Mono',monospace;font-size:13px;"><span style="color:${color};font-weight:700;">👑 ${winner}</span> won last week by ${diff.toLocaleString()}</div>`;
  }

  return `
    <div class="panel-title">Weekly Points <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted);">· resets Monday 12am</span></div>
    <div class="card" style="display:block;margin-bottom:16px;">
      <div class="side-panel-title" style="margin-bottom:6px;">Last Week's Results <span style="color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0;">(${prevRangeLabel})</span></div>
      ${prevSummary}
      <div style="display:flex;gap:20px;margin-top:8px;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text-muted);">
        <span>${state.names.abir}: ${fmt(prevTotals.abir)}</span>
        <span>${state.names.jade}: ${fmt(prevTotals.jade)}</span>
      </div>
    </div>
    <div class="col2">
      <div class="card" style="display:block;">${lineChartSvg(days, abirSeries, ABIR_COLOR, state.names.abir, weekTotalAbir)}</div>
      <div class="card" style="display:block;">${lineChartSvg(days, jadeSeries, JADE_COLOR, state.names.jade, weekTotalJade)}</div>
    </div>
  `;
}

function escAttr(str){
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');

function escHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

        ${todoRows}
        <div class="bet-form" style="margin-top:6px;margin-bottom:0;">
          <input id="noteTodo_${note.id}" placeholder="Add item" style="background:rgba(255,255,255,0.5);border-color:rgba(0,0,0,0.2);color:#14171D;">
          <button class="btn-flame" onclick="__app.addNoteTodo('${boardId}','${note.id}', document.getElementById('noteTodo_${note.id}').value.trim()); document.getElementById('noteTodo_${note.id}').value='';">Add</button>
        </div>
      </div>
    </details>
  </div>`;
}

function renderBoards(){
  if(!activeBoardId || !state.boards.find(b=>b.id===activeBoardId)){
    activeBoardId = state.boards.length ? state.boards[0].id : null;
  }

  const boardTabs = state.boards.map(b=>`
    <button class="board-tab removable ${b.id===activeBoardId?'active':''}" data-remove="__app.removeBoard('${b.id}')" onclick="__app.selectBoard('${b.id}')">${escHtml(b.name)}</button>
  `).join('');

  const newBoardForm = `<details class="add-details">
    <summary>+ New board</summary>
    <div class="bet-form" style="margin-top:10px;">
      <input id="newBoardName" placeholder="Board name">
      <button class="btn-flame" onclick="__app.addBoard()">Create</button>
    </div>
  </details>`;

  if(!activeBoardId){
    return `
      <div class="panel-title">Thought Boards</div>
      <div class="board-tabs">${boardTabs}</div>
      ${newBoardForm}
      <div class="empty-note">No boards yet — create one above to start pinning notes.</div>
    `;
  }

  const board = state.boards.find(b=>b.id===activeBoardId);
  const notesHtml = board.notes.length===0
    ? '<div class="empty-note">No sticky notes here yet.</div>'
    : `<div class="sticky-board">${board.notes.map(n=>renderNote(board.id, n)).join('')}</div>`;

  const newNoteForm = `<details class="add-details">
    <summary>+ New sticky note</summary>
    <div style="margin-top:10px;">
      <textarea id="newNoteText_${board.id}" placeholder="Write something..." style="width:100%;min-height:60px;background:var(--glass-light);border:1px solid var(--border-glass);color:var(--text);padding:8px;font-family:'Inter',sans-serif;font-size:13px;border-radius:3px;resize:vertical;"></textarea>
      <input type="hidden" id="newNoteColor_${board.id}" value="${NOTE_COLORS[0]}">
      <div style="display:flex;gap:6px;margin:8px 0;">
        ${NOTE_COLORS.map((c,i)=>`<button type="button" onclick="document.getElementById('newNoteColor_${board.id}').value='${c}'" style="width:20px;height:20px;border-radius:50%;background:${c};border:2px solid ${i===0?'var(--flame)':'var(--border-glass)'};cursor:pointer;"></button>`).join('')}
      </div>
      <button class="btn-flame" onclick="__app.addNote('${board.id}')">Pin Note</button>
    </div>
  </details>`;

  return `
    <div class="panel-title">Thought Boards</div>
    <div class="board-tabs">${boardTabs}</div>
    ${newBoardForm}
    <div class="panel-title" style="margin-top:20px;">${escHtml(board.name)}</div>
    ${newNoteForm}
    <div style="margin-top:14px;">${notesHtml}</div>
  `;
}

function renderTodaySidebar(){
  const el = document.getElementById('todayCol');
  if(!el) return;
  const day = todayKey();
  const todays = state.history.filter(h=>{
    const d = new Date(h.ts);
    return (d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()) === day;
  });
  const totals = todayTotals();
  const rowsFor = (p)=>{
    const items = todays.filter(h=>h.party===p);
    if(items.length===0) return '<div class="empty-note" style="padding:4px 0;font-size:12px;">Nothing logged yet today.</div>';
    return items.map(h=>{
      const cls = h.delta>0?'pos':(h.delta<0?'neg':'');
      return `<div class="side-item">
        <span class="side-item-label">${h.reason}</span>
        <span class="side-item-delta ${cls}">${fmt(h.delta)}</span>
      </div>`;
    }).join('');
  };
  let leadHtml = 'Tied today';
  if(totals.abir !== totals.jade){
    const abirLeads = totals.abir > totals.jade;
    const diff = Math.abs(totals.abir - totals.jade);
    const color = abirLeads ? '#FF4D5E' : '#3ECF6E';
    leadHtml = `<b style="color:${color}">${abirLeads?state.names.abir:state.names.jade}</b> +${diff.toLocaleString()} today`;
  }
  el.innerHTML = `<div class="side-panel">
    <div class="side-panel-title">Today's Leaderboard</div>
    <div class="side-panel-sub">${leadHtml}</div>
    <div class="side-group">
      <div class="side-group-name" style="color:var(--abir-accent);">${state.names.abir} · ${fmt(totals.abir)}</div>
      ${rowsFor('abir')}
    </div>
    <div class="side-group">
      <div class="side-group-name" style="color:var(--jade-accent);">${state.names.jade} · ${fmt(totals.jade)}</div>
      ${rowsFor('jade')}
    </div>
  </div>`;
}

function renderTodoSidebar(){
  const el = document.getElementById('todoCol');
  if(!el) return;
  const section = (party, title)=>{
    const items = state.todos[party];
    const accent = party==='abir' ? 'var(--abir-accent)' : 'var(--jade-accent)';
    const rows = items.length===0
      ? '<div class="empty-note" style="padding:4px 0;font-size:12px;">Nothing on the list.</div>'
      : items.map(t=>`<label class="todo-row">
          <input type="checkbox" style="accent-color:${accent};" onchange="__app.completeTodo('${party}','${t.id}')">
          <span>${t.text}</span>
        </label>`).join('');
    return `<div class="side-panel" style="border-top-color:${accent};">
      <div class="side-panel-title" style="color:${accent};">${title}</div>
      <div style="margin:10px 0;">${rows}</div>
      <div class="bet-form" style="margin-bottom:0;">
        <input id="newTodo_${party}" placeholder="Add a task">
        <button class="btn-flame" onclick="__app.addTodo('${party}')">Add</button>
      </div>
    </div>`;
  };
  el.innerHTML = section('jade', state.names.jade + "'s To-Do") + section('abir', state.names.abir + "'s To-Do");
}

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  activeTab = btn.dataset.tab;
  renderTabs();
  renderContent();
});

const __app = {
  renameParty,
  claim(key, party, pts, label){ claim(key, party, pts, label); },
  undo(key, party){ undoLast(key, party); },
  redeemShop(party,id){ redeemShop(party, id); },
  redeemFlexShop(party,id){
    const input = document.getElementById('flex-'+party+'-'+id);
    const val = parseInt(input.value,10);
    if(!val || val<=0){ alert('Enter a point cost first.'); return; }
    redeemShop(party, id, val);
  },
  addDaily(){
    const label = document.getElementById('newDailyLabel').value.trim();
    const pts = parseInt(document.getElementById('newDailyPts').value,10);
    if(!label || !pts){ alert('Give it a name and a positive point value.'); return; }
    addCustomDaily(label, pts);
  },
  removeDaily(id){ removeCustomDaily(id); },
  hideDaily(id){ hideBaseDaily(id); },
  addQuest(party){
    const label = document.getElementById('newQuestLabel_'+party).value.trim();
    const pts = parseInt(document.getElementById('newQuestPts_'+party).value,10);
    if(!label || !pts){ alert('Give it a name and a positive point value.'); return; }
    addCustomQuest(party, label, pts);
  },
  removeQuest(party,id){ removeCustomQuest(party, id); },
  hideQuest(party,id){ hideBaseQuest(party, id); },
  addShopItem(party){
    const label = document.getElementById('newShopLabel_'+party).value.trim();
    const pts = parseInt(document.getElementById('newShopPts_'+party).value,10);
    const note = document.getElementById('newShopNote_'+party).value.trim();
    if(!label || !pts){ alert('Give it a name and a positive point cost.'); return; }
    addCustomShop(party, label, pts, note);
  },
  removeShopItem(party,id){ removeCustomShop(party, id); },
  hideShopItem(party,id){ hideBaseShopItem(party, id); },
  addPenalty(){
    const label = document.getElementById('newPenaltyLabel').value.trim();
    const pts = parseInt(document.getElementById('newPenaltyPts').value,10);
    if(!label || !pts){ alert('Give it a name and a positive point value to deduct.'); return; }
    addCustomPenalty(label, pts);
  },
  removePenalty(id){ removeCustomPenalty(id); },
  hidePenalty(id){ hideBasePenalty(id); },
  addTodo(party){
    const input = document.getElementById('newTodo_'+party);
    const text = input.value.trim();
    if(!text) return;
    addTodoItem(party, text);
  },
  completeTodo(party,id){ completeTodoItem(party, id); },
  addBoard(){
    const input = document.getElementById('newBoardName');
    const name = input.value.trim();
    if(!name){ alert('Give the board a name.'); return; }
    addBoard(name);
  },
  removeBoard(id){ removeBoard(id); },
  selectBoard(id){ activeBoardId = id; renderContent(); },
  addNote(boardId){
    const textEl = document.getElementById('newNoteText_'+boardId);
    const colorEl = document.getElementById('newNoteColor_'+boardId);
    const text = textEl.value.trim();
    if(!text){ alert('Write something on the note first.'); return; }
    addNote(boardId, text, colorEl.value);
  },
  removeNote(boardId, noteId){ removeNote(boardId, noteId); },
  updateNoteText(boardId, noteId, text){ updateNoteText(boardId, noteId, text); },
  setNoteColor(boardId, noteId, color){ setNoteColor(boardId, noteId, color); },
  addNoteTodo(boardId, noteId, text){ addNoteTodo(boardId, noteId, (text||'').trim()); },
  removeNoteTodo(boardId, noteId, todoId){ removeNoteTodo(boardId, noteId, todoId); },
  addBet(){
    const title = document.getElementById('betTitle').value.trim();
    const stake = parseInt(document.getElementById('betStake').value,10);
    const recurring = document.getElementById('betRecurring').checked;
    if(!title || !stake || stake<=0){ alert('Give the bet a title and a stake in points.'); return; }
    state.bets.unshift({id:'bet_'+Date.now(), title, stake, status:'open', recurring, ts:Date.now()});
    saveState(); renderAll();
  },
  resolveBet(id, winner){
    const bet = state.bets.find(b=>b.id===id);
    if(!bet) return;
    const loser = winner === 'abir' ? 'jade' : 'abir';
    bet.status = 'resolved';
    bet.winner = winner;
    claim('bet:'+id, winner, bet.stake, 'Bet won: '+bet.title);
    claim('bet:'+id, loser, -bet.stake, 'Bet lost: '+bet.title);
    if(bet.recurring){
      state.bets.unshift({id:'bet_'+Date.now(), title: bet.title, stake: bet.stake, status:'open', recurring:true, ts:Date.now()});
      saveState(); renderAll();
    }
    fireConfetti(winner);
  },
  revertBet(id){
    const bet = state.bets.find(b=>b.id===id);
    if(!bet || bet.status!=='resolved') return;
    if(!confirm('Revert this result? The point transfer will be undone and this bet will be deleted completely — nothing will remain.')) return;
    const loser = bet.winner === 'abir' ? 'jade' : 'abir';
    state.points[bet.winner] = (state.points[bet.winner]||0) - bet.stake;
    state.points[loser] = (state.points[loser]||0) + bet.stake;
    // wipe the original "bet won/lost" entries so nothing remains in the log or leaderboards
    state.history = state.history.filter(h => h.key !== ('bet:'+id));
    delete state.counts.abir['bet:'+id];
    delete state.counts.jade['bet:'+id];
    // delete the bet itself — nothing left behind
    state.bets = state.bets.filter(b=>b.id!==id);
    saveState(); renderAll();
  },
  voidBet(id){
    const bet = state.bets.find(b=>b.id===id);
    if(!bet) return;
    bet.status = 'void';
    saveState(); renderAll();
  },
  deleteBet(id){
    const bet = state.bets.find(b=>b.id===id);
    if(!bet) return;
    const warn = bet.status==='resolved'
      ? 'Delete this bet? Points already awarded from it will NOT be reverted — revert first if you need that.'
      : 'Delete this bet?';
    if(!confirm(warn)) return;
    state.bets = state.bets.filter(b=>b.id!==id);
    saveState(); renderAll();
  },
  cleanupBetHistory(){
    const removed = cleanupOrphanedBetHistory();
    if(removed > 0){
      saveState(); renderAll();
      alert('Removed '+removed+' leftover bet log entr'+(removed===1?'y':'ies')+'.');
    } else {
      alert('Nothing to clean up — the log is already clear of orphaned bet entries.');
    }
  },
  resetSeason
};
window.__app = __app;

/* ---------------- init ---------------- */
state = defaultState();
subscribeState();

} // end runApp
</script>
