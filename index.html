<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Points</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050A10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Points">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<link rel="apple-touch-icon" id="faviconTouch" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- The one font link. Its href is REPLACED on every switch, never appended
     to, so nothing accumulates. -->
<link rel="stylesheet" id="themeFont" href="">
<!-- The sorting screen shows every house in its own typeface at once, so it
     needs their display faces together. One more managed link, set once and
     reused — never appended to. -->
<link rel="stylesheet" id="pickerFont" href="">

<!-- ==========================================================================
     THEMES — the contract, then one file per theme.
     Classic scripts on purpose: they must have registered on
     window.ORIGIN_THEMES before the deferred module below runs.
     Adding a sixth theme is one <script> line here and one new file.
     ========================================================================== -->
<script src="themes/contract.js"></script>
<script src="themes/pano.js"></script>
<script src="themes/diorama.js"></script>
<script src="themes/gryffindor.js"></script>
<script src="themes/slytherin.js"></script>
<script src="themes/origin.js"></script>

<style id="coreCSS">

/* ============================================================
   CORE — structure only.
   There is not one colour, typeface or corner radius in this
   stylesheet. Every one of them is a token, and every token is
   declared in full by the active theme (themes/*.js). If you
   find yourself typing a hex value below, it belongs in a theme.
   The :root block here exists solely so the page is not naked
   for the ~1 frame before the first theme is applied.
   ============================================================ */
:root{
  color-scheme:dark;
  --void:#08080A; --deep:#0C0C10; --surface:rgba(20,20,26,.7); --surface-2:rgba(255,255,255,.04);
  --surface-hover:rgba(255,255,255,.06); --raised:#12121A; --toast:#12121A;
  --overlay:rgba(0,0,0,.72); --track:rgba(0,0,0,.5); --input:rgba(0,0,0,.4); --scroll:#26262E;
  --line:rgba(255,255,255,.14); --line-soft:rgba(255,255,255,.08); --line-hard:rgba(255,255,255,.3);
  --txt:#EDEDF0; --txt-2:#A0A0AC; --txt-3:#6E6E7C; --on-accent:#08080A;
  --accent:#8899AA; --accent-hi:#B8C4D0; --accent-dim:#4A5560; --accent-wash:rgba(136,153,170,.12);
  --gold:#C9A94E; --warn:#D9A441; --danger:#D9534F; --ok:#4CAF7D; --info:#5B8DD9;
  --milestone:#C9A94E; --penalty:#D9534F;
  --focus-work:#5B8DD9; --focus-break:#4CAF7D; --focus-long:#C9A94E;
  --f-display:system-ui,sans-serif; --f-body:system-ui,sans-serif; --f-mono:ui-monospace,monospace;
  --f-display-scale:1; --f-ui-scale:1; --tt-display:none; --ls-display:0;
  --f-label:var(--f-mono); --tt-label:uppercase; --ls-label:.12em;
  --radius:4px; --radius-lg:8px; --chip-radius:20px; --border-w:1px;
  --panel-clip:none; --card-clip:none;

  /* set by the engine from theme.ops — never authored in CSS */
  --op-a:#D9534F; --op-b:#4CAF7D;
  /* motion, set from theme.motion */
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.18s; --dur-enter:.22s;

  --shadow:rgba(0,0,0,.7);

  /* The sorting screen is the one surface that belongs to no house — it is
     where you are standing before you have one, and it shows all four at
     once, so it cannot borrow any of their palettes. These five are its own,
     and they are the only colours in this file that no theme can reach. */
  --cer-bg:#07070A; --cer-txt:#F2F2F6; --cer-txt-2:#9C9CA8;
  --cer-txt-3:#8A8A96; --cer-hover:#D2D2DA; --cer-shadow:#000;

  --rail-w:84px;
  --shell-max:1620px;
}

/* The theme paints the page ground; #sky carries theme.texture, which the
   engine writes into the managed stylesheet. Nothing here knows what it
   looks like. */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}

/* Crossfade on theme switch. The engine adds .theming for one beat; with
   prefers-reduced-motion the whole thing is a no-op via the global rule
   at the foot of this file. */
/* the header emblem: a theme may draw live art here, or nothing at all */
#emblem{display:flex;align-items:center;flex:none;}
#emblem:empty{display:none;}
#emblem svg{display:block;width:56px;height:56px;}
@media(max-width:620px){#emblem svg{width:42px;height:42px;}}

/* ============================================================
   THE SORTING
   One screen, four cards, no scrolling at 390px. Each card paints
   itself from its own house's tokens, which are set inline by the
   renderer — there is not one house colour in this block.
   ============================================================ */
#ceremony{position:fixed;inset:0;z-index:400;display:none;overflow:hidden;
  background:var(--cer-bg);padding:max(14px,env(safe-area-inset-top)) 14px 14px;}
#ceremony.on{display:flex;flex-direction:column;justify-content:center;gap:10px;}
body.sorting{overflow:hidden;}
.cer-head{text-align:center;flex:none;}
.cer-head .k{font-family:var(--f-label);font-size:9.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--cer-txt-3);}
.cer-head h2{margin:6px 0 0;font-size:clamp(18px,3.2vw,25px);color:var(--cer-txt);
  font-family:var(--f-display);text-transform:none;letter-spacing:.01em;}
.cer-head p{margin:5px auto 0;max-width:48ch;font-size:12px;line-height:1.5;color:var(--cer-txt-2);}
.cer-grid{
  flex:0 1 auto;min-height:0;display:grid;gap:10px;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  max-height:min(680px,100%);
}
@media(min-width:900px){
  .cer-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);
    max-height:min(430px,100%);}
}
.cer-card{
  position:relative;overflow:hidden;text-align:left;padding:0;min-height:0;
  border:1px solid var(--ch-line);border-radius:var(--ch-radius);
  background:var(--ch-bg);color:var(--ch-txt);cursor:pointer;display:block;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s;
}
.cer-card:hover,.cer-card:focus-visible{transform:translateY(-4px);outline:none;
  border-color:var(--ch-accent);box-shadow:0 16px 40px -16px var(--cer-shadow),0 0 0 1px var(--ch-accent);}
.cer-card.chosen{box-shadow:0 0 0 2px var(--ch-accent);}
.cer-card.dim{opacity:.2;transform:scale(.97);}
.cer-tex{position:absolute;inset:0;pointer-events:none;}
.cer-body{position:relative;height:100%;padding:13px;display:flex;flex-direction:column;gap:8px;}
.cer-crest{width:38px;height:38px;flex:none;color:var(--ch-accent);}
.cer-crest svg{width:100%;height:100%;}
.cer-name{font-family:var(--ch-fdisp);font-size:clamp(16px,2.1vw,21px);line-height:1.08;
  color:var(--ch-txt);text-transform:var(--ch-tt);letter-spacing:var(--ch-ls);}
.cer-tag{font-family:var(--ch-fbody);font-size:11px;line-height:1.45;color:var(--ch-txt2);}
/* a working miniature of the house's own chrome, so the card previews the
   thing it is offering rather than describing it */
.cer-prev{margin-top:auto;display:flex;flex-direction:column;gap:7px;min-height:0;}
.cer-panel{border:1px solid var(--ch-line);border-radius:var(--ch-radius);
  background:var(--ch-surface);padding:8px 9px;display:flex;flex-direction:column;gap:6px;
  clip-path:var(--ch-clip);}
.cer-panel .ttl{font-family:var(--ch-flabel);font-size:8px;letter-spacing:var(--ch-lslabel);
  text-transform:var(--ch-ttlabel);color:var(--ch-txt2);}
.cer-row{display:flex;align-items:center;gap:6px;}
.cer-row .cer-mk{width:12px;height:12px;flex:none;display:block;color:var(--ch-mark);}
.cer-row .cer-mk svg{display:block;width:12px;height:12px;}
.cer-row .nm{flex:1;min-width:0;font-family:var(--ch-fbody);font-size:10.5px;
  color:var(--ch-txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cer-row .vl{font-family:var(--ch-fmono);font-size:9.5px;color:var(--ch-accent);}
.cer-bar{height:7px;border-radius:2px;background:var(--ch-track);overflow:hidden;}
.cer-bar i{display:block;height:100%;width:58%;background:var(--ch-accent);}
.cer-act{display:flex;align-items:center;gap:6px;}
.cer-act .b{font-family:var(--ch-fdisp);font-size:9.5px;padding:4px 11px;
  border-radius:var(--ch-btnr);background:var(--ch-accent);color:var(--ch-on);
  text-transform:var(--ch-tt);letter-spacing:var(--ch-ls);}
.cer-act .g{font-family:var(--ch-flabel);font-size:8px;letter-spacing:var(--ch-lslabel);
  text-transform:var(--ch-ttlabel);color:var(--ch-txt2);}
.cer-foot{flex:none;text-align:center;padding-top:4px;}
.cer-foot button{background:none;border:0;color:var(--cer-txt-3);font-size:11.5px;
  text-decoration:underline;text-underline-offset:3px;padding:5px 9px;}
.cer-foot button:hover{color:var(--cer-hover);}
.cer-sep{color:var(--cer-txt-3);opacity:.6;}
@media(prefers-reduced-motion:reduce){
  .cer-card,.cer-card.chosen,.cer-card.dim{transition:none;transform:none;}
}

#themeVeil{position:fixed;inset:0;z-index:500;pointer-events:none;opacity:0;
  background:var(--void);transition:opacity .2s linear;}
#themeVeil.on{opacity:1;}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--void);color:var(--txt);
  font-family:var(--f-body);font-size:14px;line-height:1.5;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:var(--on-accent);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:9px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--accent);}

/* ============================================================
   Type
   ============================================================ */
.mono{font-family:var(--f-mono);}
.hd{font-family:var(--f-display);font-weight:600;text-transform:var(--tt-display);letter-spacing:var(--ls-display);}
.eyebrow{font-family:var(--f-label);font-size:10px;letter-spacing:var(--ls-label);
  text-transform:var(--tt-label);color:var(--txt-3);}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;
  text-transform:var(--tt-display);letter-spacing:var(--ls-display);}

/* ============================================================
   Chrome — panels, buttons, inputs
   ============================================================ */
.panel{
  background:var(--surface);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:var(--radius);position:relative;
}
.panel.cut{clip-path:var(--panel-clip);}
.panel-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--line-soft);
}
.panel-h .t{font-family:var(--f-display);font-weight:600;font-size:calc(12.5px * var(--f-ui-scale));
  text-transform:var(--tt-display);letter-spacing:var(--ls-display);color:var(--txt);}
.panel-b{padding:14px;}
.sect-title{
  font-family:var(--f-label);font-weight:600;font-size:calc(12px * var(--f-ui-scale));
  letter-spacing:var(--ls-label);text-transform:var(--tt-label);color:var(--txt-3);margin:22px 0 10px;
  display:flex;align-items:center;gap:10px;
}
.sect-title:first-child{margin-top:0;}
.sect-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}

.btn{
  font-family:var(--f-display);font-weight:600;font-size:calc(12px * var(--f-ui-scale));
  letter-spacing:var(--ls-display);text-transform:var(--tt-display);
  background:var(--surface-2);border:var(--border-w) solid var(--line);
  color:var(--txt-2);padding:8px 14px;border-radius:var(--radius);
  transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),background var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform .08s;
  white-space:nowrap;
}
.btn:hover:not(:disabled){color:var(--accent);border-color:var(--line-hard);background:var(--accent-wash);}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-hi));
  color:var(--on-accent);border-color:transparent;box-shadow:0 3px 16px var(--accent-wash);}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);color:var(--on-accent);}
.btn.gold{border-color:var(--gold);color:var(--gold);}
.btn.gold:hover:not(:disabled){background:color-mix(in srgb,var(--gold) 12%,transparent);border-color:var(--gold);color:var(--gold);}
.btn.warn:hover:not(:disabled){color:var(--danger);border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);}
.btn.a{border-color:color-mix(in srgb,var(--op-a) 45%,transparent);color:var(--op-a);}
.btn.a:hover:not(:disabled){border-color:var(--op-a);color:var(--op-a);background:color-mix(in srgb,var(--op-a) 12%,transparent);}
.btn.b{border-color:color-mix(in srgb,var(--op-b) 45%,transparent);color:var(--op-b);}
.btn.b:hover:not(:disabled){border-color:var(--op-b);color:var(--op-b);background:color-mix(in srgb,var(--op-b) 12%,transparent);}
.btn.sm{padding:5px 9px;font-size:11px;}
.btn.icon{padding:6px 9px;background:none;border-color:transparent;color:var(--txt-3);font-size:13px;}
.btn.icon:hover:not(:disabled){color:var(--accent);background:var(--surface-2);}
.btn.icon.warn:hover:not(:disabled){color:var(--danger);}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-wash);}

.inp{
  background:var(--input);border:1px solid var(--line);color:var(--txt);
  padding:9px 11px;font-size:13.5px;border-radius:var(--radius);width:100%;
  transition:border-color .15s,box-shadow .15s;
}
.inp:focus{outline:none;border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-wash);}
.inp::placeholder{color:var(--txt-3);}
select.inp{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--txt-3) 50%),linear-gradient(135deg,var(--txt-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
select.inp option{background:var(--raised);}
input[type="color"].inp{height:42px;padding:4px;cursor:pointer;}
input[type="date"].inp{color-scheme:inherit;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.grow{flex:1;min-width:0;}
.muted{color:var(--txt-3);}
.empty{color:var(--txt-3);font-size:13px;padding:16px 4px;font-style:italic;}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--f-label);
  font-size:10px;letter-spacing:var(--ls-label);text-transform:var(--tt-label);padding:2px 7px;
  border:1px solid var(--line);border-radius:2px;color:var(--txt-3);white-space:nowrap;
}
.pos{color:var(--ok);} .neg{color:var(--penalty);}
details>summary{list-style:none;cursor:pointer;}
details>summary::-webkit-details-marker{display:none;}
.add-sum{
  font-family:var(--f-label);font-weight:600;font-size:11.5px;letter-spacing:var(--ls-label);
  text-transform:var(--tt-label);color:var(--txt-3);border:1px dashed var(--line);
  padding:8px 14px;border-radius:var(--radius);display:inline-block;transition:all .15s;
}
.add-sum:hover{color:var(--accent);border-color:var(--line-hard);}
details[open]>.add-sum{color:var(--accent);border-style:solid;margin-bottom:10px;}

/* ============================================================
   Shell layout
   ============================================================ */
#shell{position:relative;z-index:1;max-width:var(--shell-max);margin:0 auto;
  padding:0 14px calc(84px + env(safe-area-inset-bottom));}
@media(min-width:900px){#shell{padding:0 20px 40px;}}

/* --- Operator header --- */
#hud{padding:16px 0 14px;}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.brandmark{display:flex;align-items:center;gap:12px;}
.brand-glyph{
  width:38px;height:38px;flex-shrink:0;display:flex;
  background:linear-gradient(150deg,var(--accent),var(--gold));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 22px var(--accent-wash);
}
.brand-glyph span{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--on-accent);
  line-height:1;}
.brand-title{font-size:calc(clamp(17px,2.6vw,22px) * var(--f-display-scale));
  letter-spacing:var(--ls-display);color:var(--txt);}
.hud-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
#syncDot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex-shrink:0;}
#syncDot.saving{background:var(--gold);box-shadow:0 0 8px var(--gold);}
#syncDot.off{background:var(--danger);box-shadow:0 0 8px var(--danger);}

/* --- Standing bars --- */
.ops{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:620px){.ops{gap:8px;}}
.op{
  position:relative;overflow:hidden;padding:13px 15px;
  background:linear-gradient(150deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-left:2px solid var(--op);
  clip-path:var(--card-clip);
}
.op.lead{box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 30%,transparent),0 8px 30px -12px var(--op);}
.op-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.op-name{font-family:var(--f-display);font-weight:700;font-size:calc(15px * var(--f-display-scale));
  letter-spacing:var(--ls-display);text-transform:var(--tt-display);color:var(--op);cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0;}
.op-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* the small permanent mark of whichever house this operator is in */
.house-mark{display:flex;flex:none;opacity:.9;}
.house-mark svg{display:block;}
@media(max-width:620px){
  /* the crest must never cost the name: shrink the mark and let the rank
     block give way before the name does */
  .house-mark svg{width:12px !important;height:12px !important;}
  .op-name{gap:4px;}
  .op-rank{font-size:9px;min-width:0;flex-shrink:1;overflow:hidden;}
  .op-top{gap:5px;}
}
.op-name:hover{filter:brightness(1.2);}
.op-rank{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--txt-3);
  text-align:right;white-space:nowrap;}
.op-pts{font-family:var(--f-mono);font-size:clamp(22px,4.4vw,30px);font-weight:700;
  letter-spacing:.02em;margin:6px 0 1px;line-height:1;}
.op-sub{font-family:var(--f-mono);font-size:10.5px;color:var(--txt-3);
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px;}
.op-track{height:4px;background:var(--track);border-radius:4px;overflow:hidden;}
.op-fill{height:100%;background:var(--tier);border-radius:4px;
  transition:width .6s var(--ease);}
.op-delta{font-family:var(--f-mono);font-size:11px;}
.streak{color:var(--gold);}

/* --- Nav rail / bottom bar. Wraps; never a clipped scroller. --- */
#nav{
  display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 18px;
  padding:5px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.nav-btn{
  display:flex;align-items:center;gap:8px;flex:1 1 auto;justify-content:center;
  font-family:var(--f-display);font-weight:600;font-size:calc(12px * var(--f-ui-scale));
  letter-spacing:var(--ls-display);text-transform:var(--tt-display);
  background:transparent;border:var(--border-w) solid transparent;
  color:var(--txt-3);padding:9px 12px;border-radius:var(--radius);transition:all var(--dur) var(--ease);
}
.nav-btn .ic{font-size:14px;line-height:1;}
.nav-btn:hover{color:var(--txt);background:var(--surface-2);}
.nav-btn.on{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-hi));
  box-shadow:0 3px 14px var(--accent-wash);}
.nav-btn .kbd{font-family:var(--f-mono);font-size:9px;opacity:.5;}
@media(max-width:760px){
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;border-radius:0;
    border:0;border-top:1px solid var(--line);background:var(--deep);flex-wrap:nowrap;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  .nav-btn,:root[data-theme] .nav-btn{flex-direction:column;gap:3px;font-size:9px;letter-spacing:.06em;

/* First paint, before Firestore has said anything. We cache the last applied
   theme's ground colour and font link so the app opens in the right house
   instead of flashing a default and then correcting itself. The engine takes
   over the moment the module boots. */
(function () {
  try {
    var c = JSON.parse(localStorage.getItem('origin_theme_paint') || 'null');
    if (!c) return;
    document.documentElement.setAttribute('data-theme', c.id);
    var r = document.documentElement.style;
    for (var k in c.tokens) r.setProperty('--' + k, c.tokens[k]);
    if (c.font) document.getElementById('themeFont').href = c.font;
    if (c.favicon) {
      document.getElementById('favicon').href = c.favicon;
      document.getElementById('faviconTouch').href = c.favicon;
    }
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && c.themeColor) m.setAttribute('content', c.themeColor);
  } catch (e) {}
})();
</script>

async function firebaseStore() {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js");
  const { getFirestore, doc, onSnapshot, setDoc, initializeFirestore,
          persistentLocalCache, persistentMultipleTabManager } = fs;
  const { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } =
    await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js");

  const fbApp = initializeApp(firebaseConfig);
  /* offline cache: claims made on a phone with no signal land as soon as it
     reconnects, instead of being lost */
  let db;
  try {
    db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch (e) {
    db = getFirestore(fbApp);
  }
  const ref = doc(db, DOC_PATH[0], DOC_PATH[1]);
  const auth = getAuth(fbApp);
  try { await setPersistence(auth, browserLocalPersistence); } catch (e) {}

  return {
    mode: 'live',
    auth, signIn: signInWithEmailAndPassword, signOut, onAuthStateChanged,
    subscribe(fn, onErr) { onSnapshot(ref, snap => fn(snap.exists() ? snap.data() : null), onErr); },
    save(s) { return setDoc(ref, s); }
  };
}

   THEME ENGINE
   --------------------------------------------------------------------------
   The core knows no theme by name. It knows the contract in
   themes/contract.js, and it knows how to put one on:

     tokens  -> CSS custom properties on <html>
     css     -> the single managed <style id="themeCSS">, replaced not appended
     fonts   -> the single managed <link id="themeFont">, href swapped
     favicon -> both <link rel=icon> hrefs
     ops     -> --op-a / --op-b, re-derived per theme so neither operator
                ever collides with the house chrome
     motion  -> --ease / --dur / --dur-enter

   Applying a theme touches no state, cancels no timer, and re-renders through
   the same renderAll() as everything else — so a running focus block and a
   half-typed task both survive it.
   ========================================================================== */

const REG = window.ORIGIN_THEMES;
if (!REG || !Object.keys(REG.list).length) {
  document.body.innerHTML = '<pre style="padding:24px;font:13px ui-monospace,monospace;color:#f66">'
    + 'No themes registered.\n\n' + ((REG && REG.problems) || []).join('\n') + '</pre>';
  throw new Error('no themes');
}
/* A theme that failed validation never reaches the registry. If any did,
   say so loudly rather than letting a half-dressed house ship. */
if (REG.problems.length) {
  console.error('[themes] ' + REG.problems.length + ' problem(s) — those themes were refused.');
  if (DEMO || new URLSearchParams(location.search).has('dev')) {
    const bar = document.createElement('pre');
    bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;margin:0;padding:10px 14px;'
      + 'background:#3B0A0A;color:#FFB4B4;font:11px/1.5 ui-monospace,monospace;max-height:34vh;overflow:auto;';
    bar.textContent = 'THEME CONTRACT VIOLATIONS\n' + REG.problems.join('\n');
    document.body.appendChild(bar);
  }

/* ---- the accessors every render function goes through ---- */
/* copy: no user-visible string is written anywhere but a theme file */
function C(key, vars) {
  let v = (theme().copy || {})[key];
  if (v == null) { console.warn('[copy] missing "' + key + '" in theme ' + THEME); return key; }
  if (vars) for (const k in vars) v = v.split('{' + k + '}').join(vars[k]);
  return v;
}
/* icons: drawn SVG from the theme, never a glyph */

  const raw = (theme().icons || {})[key];
  if (!raw) { console.warn('[icon] missing "' + key + '" in theme ' + THEME); return ''; }
  return size ? raw.replace('<svg', '<svg width="' + size + '" height="' + size + '"') : raw;

   same room with the same deeds in it. */

/* ---- putting one on ---- */
let themeApplying = false;
function applyTheme(id, opts) {
  const o = opts || {};
  if (!REG.list[id]) return;
  const t = REG.list[id];
  const first = o.first === true;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  const paint = () => {
    THEME = id;
    const root = document.documentElement;
    root.setAttribute('data-theme', id);

    /* tokens — the complete set, every time; nothing is left over from the
       theme before because the contract guarantees all of them are present */
    const r = root.style;
    REG.TOKENS.forEach(k => r.setProperty('--' + k, t.tokens[k]));
    /* the two identity colours, derived per theme, not inherited */
    r.setProperty('--op-a', t.ops.a);
    r.setProperty('--op-b', t.ops.b);
    /* motion */
    r.setProperty('--ease', t.motion.ease);
    r.setProperty('--dur', t.motion.dur);
    r.setProperty('--dur-enter', t.motion.enter);

    /* the one stylesheet and the one font link, replaced in place */
    const st = document.getElementById('themeCSS');
    st.textContent = '#sky{background:' + t.texture + ';}\n' + t.css;
    const fl = document.getElementById('themeFont');
    if (fl.getAttribute('href') !== t.fonts.googleHref) fl.href = t.fonts.googleHref;

    document.getElementById('favicon').href = t.favicon;
    document.getElementById('faviconTouch').href = t.favicon;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t.themeColor);
    document.title = t.copy.brand + ' · ' + t.copy.score;

    /* cache just enough to paint the next cold start in the right house */
    try {
      localStorage.setItem('origin_theme_paint', JSON.stringify({
        id, tokens: t.tokens, font: t.fonts.googleHref,
        favicon: t.favicon, themeColor: t.themeColor
      }));
    } catch (e) {}

    if (!first) { try { renderAll(); } catch (e) { console.error(e); } }
  };

  if (first || reduce || o.instant) { paint(); return; }

  /* crossfade: veil in, repaint behind it, veil out. No layout is touched,
     so nothing shifts — the page underneath is the same size throughout. */
  if (themeApplying) return;
  themeApplying = true;
  const veil = document.getElementById('themeVeil');
  veil.classList.add('on');
  setTimeout(() => {
    paint();
    requestAnimationFrame(() => {
      veil.classList.remove('on');
      setTimeout(() => { themeApplying = false; }, 210);
    });
  }, 200);
}

  if (Array.isArray(raw.nodes)   && raw.nodes.length)   s.nodes   = raw.nodes;
  if (Array.isArray(raw.lists)   && raw.lists.length)   s.lists   = raw.lists;
  if (Array.isArray(raw.shop)    && raw.shop.length)    s.shop    = raw.shop;
  s.tasks = A(raw.tasks, []);
  return normalizeRooms(migrate(s, raw));
}

/* ---------------- one-time migration off the Season-1 document ----------------
   Season 1 stored flat lists (customDaily / customQuests / hiddenX / boards /
   ideas / todos / scratch). Everything is folded into the v2 model here, once,
   and the old fields are dropped. Points, counts, history and bets are never
   touched — the leaderboard survives untouched.                                */
function migrate(s, raw) {
  if (s.schema >= 2 && !raw.customDaily && !raw.boards && !raw.todos && !raw.hiddenDaily) {
    s.schema = 2; return s;
  }
  const hiddenDaily = A(raw.hiddenDaily, []);
  const hiddenPen   = A(raw.hiddenPenalties, []);
  const hiddenQ     = O(raw.hiddenQuests, { abir: [], jade: [] });
  const hiddenShop  = O(raw.hiddenShop, { abir: [], jade: [] });

  /* items you had removed in Season 1 stay removed */
  s.nodes = s.nodes.filter(n => {
    if (n.id.startsWith('daily:')) return !hiddenDaily.includes(n.id.slice(6));
    if (n.id.startsWith('pen:'))   return !hiddenPen.includes(n.id.slice(4));
    if (n.id.startsWith('quest:')) {
      const [, party, qid] = n.id.split(':');
      return !A(hiddenQ[party], []).includes(qid);
    }
    return true;
  });
  s.shop = s.shop.filter(i => !A(hiddenShop[i.o], []).includes(i.id.slice(5)));

  /* custom entries you added in Season 1 become nodes on sensible planets */
  let ord = s.nodes.length;
  A(raw.customDaily, []).forEach(it => {
    s.nodes.push({ id: 'daily:' + it.id, p: 'earth', n: it.label, pts: it.pts, t: 'ritual', o: 'both', order: ord++ });
  });
  A(raw.customPenalties, []).forEach(it => {
    s.nodes.push({ id: 'pen:' + it.id, p: 'deimos', n: it.label, pts: -Math.abs(it.pts), t: 'infested', o: 'both', order: ord++ });
  });
  PARTIES.forEach(party => {
    A(O(raw.customQuests, {})[party], []).forEach(it => {
      s.nodes.push({ id: 'quest:' + party + ':' + it.id, p: 'saturn', n: it.label, pts: it.pts, t: 'ops', o: party, order: ord++ });
    });
    /* custom shop items get the same 1.5× price bump as the built-ins */
    A(O(raw.customShop, {})[party], []).forEach(it => {
      s.shop.push({ id: 'shop:' + it.id, o: party, n: it.label, pts: it.pts ? Math.round(it.pts * 1.5) : null, note: it.note || '' });
    });
  });

  /* boards → task lists, sticky notes → tasks, note checklists → subtasks */
  let torder = 0;
  A(raw.boards, []).forEach(b => {
    const listId = 'list_' + b.id;
    s.lists.push({ id: listId, name: b.name || 'Board', o: b.party || 'both', order: s.lists.length });
    A(b.notes, []).forEach(nt => {
      const subs = A(nt.todos, []).map(t => ({ id: t.id, text: t.text, done: !!t.done }));
      const text = (nt.text || '').trim();
      if (!text && !subs.length) return;
      s.tasks.push({
        id: 'task_' + nt.id, list: listId, text: text || '(untitled note)',
        pts: 0, o: b.party || 'both', due: null, done: false, sub: subs,
        created: nt.createdAt || Date.now(), order: torder++
      });
    });
  });

  /* plain to-dos → tasks on that person's list */
  PARTIES.forEach(party => {
    A(O(raw.todos, {})[party], []).forEach(t => {
      s.tasks.push({
        id: 'task_' + t.id, list: 'list_' + party, text: t.text, pts: 0, o: party,
        due: null, done: false, sub: [], created: Date.now(), order: torder++
      });
    });
  });

  /* idea bank → an Ideas list, so nothing you wrote down disappears */
  const ideas = A(raw.ideas, []);
  if (ideas.length) {
    s.lists.push({ id: 'list_ideas', name: 'Ideas', o: 'both', order: s.lists.length });
    ideas.forEach(i => {
      s.tasks.push({
        id: 'task_' + i.id, list: 'list_ideas', text: i.text, pts: 0,
        o: (i.author === 'both' || !i.author) ? 'both' : i.author,
        due: null, done: !!i.promotedTo, sub: [], created: i.ts || Date.now(), order: torder++
      });
    });
  }

  /* the shared scratchpad becomes a pinned transmission */
  if (typeof raw.scratch === 'string' && raw.scratch.trim()) {
    s.comms.unshift({ id: 'cm_migrated', party: 'both', text: raw.scratch.trim(), ts: Date.now(), pin: true });
  }

  if (raw.season && raw.season.n) s.season = Object.assign(s.season, raw.season);
  else s.season = { n: 2, name: 'Battle For The Top', started: Date.now() };

  ['customDaily', 'customQuests', 'customShop', 'customPenalties', 'hiddenDaily', 'hiddenQuests',
   'hiddenPenalties', 'hiddenShop', 'todos', 'scratch', 'ideas', 'boards'].forEach(k => { delete s[k]; });
  s.schema = 2;
  s.migratedAt = Date.now();
  return s;
}

   CORE — sync, helpers, economy

let pendingSave = false;   // a debounced write is queued; our copy is newest

/* ---------------- helpers ---------------- */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const num = n => Math.round(n || 0).toLocaleString();
const fmt = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(Math.round(n || 0)).toLocaleString();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
/* "2026-08-27" must mean that calendar day where you live — `new Date(str)`
   would read it as UTC midnight and land a day early west of Greenwich. */
function dayDate(v) {
  if (typeof v === 'string') {
    const m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  return new Date(v);
}
const dayKey = d => { const x = dayDate(d); return x.getFullYear() + '-' + (x.getMonth() + 1) + '-' + x.getDate(); };
const todayKey = () => dayKey(Date.now());
const startOfDay = d => { const x = dayDate(d); x.setHours(0, 0, 0, 0); return x; };
const nameOf = p => (p === 'both' ? 'Both' : (state.names[p] || p));

function weekStart(from) {
  const now = from ? new Date(from) : new Date();
  const off = (now.getDay() + 6) % 7;           // days since Monday
  return startOfDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() - off));
}
function relTime(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  const d = Math.floor(s / 86400);
  if (d < 7) return d + 'd ago';
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function dueLabel(iso) {
  if (!iso) return null;
  const d = startOfDay(iso), t = startOfDay(Date.now());
  const diff = Math.round((d - t) / 86400000);
  if (diff < -1) return { txt: Math.abs(diff) + 'd overdue', cls: 'over' };
  if (diff === -1) return { txt: 'yesterday', cls: 'over' };
  if (diff === 0) return { txt: 'today', cls: 'today' };
  if (diff === 1) return { txt: 'tomorrow', cls: 'soon' };
  if (diff < 7) return { txt: dayDate(iso).toLocaleDateString(undefined, { weekday: 'long' }), cls: '' };
  return { txt: dayDate(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), cls: '' };
}
const isoDay = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };

/* ---------------- sync ---------------- */
let inFlight = 0;
/* Local edits are debounced into one whole-document write. `pendingSave` only
   covers the debounce window — once a write is actually issued we go back to
   accepting remote snapshots, so an unacknowledged write (a phone with no
   signal, with the offline cache queueing it) can never freeze the other
   person's updates out. */
function save(force) {
  if (applying && !force) return;
  pendingSave = true;
  syncDot('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 350);
}
function flush() {
  clearTimeout(saveTimer);
  if (!pendingSave) return;
  pendingSave = false;
  const snapshot = JSON.parse(JSON.stringify(state));
  inFlight++;
  Promise.resolve(store.save(snapshot)).then(() => {
    inFlight = Math.max(0, inFlight - 1);
    if (!inFlight && !pendingSave) syncDot('ok');
  }).catch(e => {
    console.error('save failed', e);
    inFlight = Math.max(0, inFlight - 1);
    syncDot('off');
    toast('Could not reach the database — that change is queued.', { kind: 'warn' });
  });
}
window.addEventListener('online', () => syncDot('ok'));
window.addEventListener('offline', () => syncDot('off'));
function syncDot(k) {
  const dot = $('#syncDot'), txt = $('#syncTxt');
  if (!dot) return;
  dot.className = k === 'ok' ? '' : k;
  txt.textContent = k === 'ok' ? (store.mode === 'demo' ? 'sandbox' : 'live') : k === 'saving' ? 'saving' : 'offline';
}
function subscribe() {
  store.subscribe(raw => {
    if (pendingSave && booted) return;           // our copy is newer; ignore the echo
    applying = true;
    const fresh = !raw;
    const needsMigration = !!raw && raw.schema !== 2;
    state = mergeState(raw);
    applying = false;
    booted = true;
    if (fresh || needsMigration) save(true);   // persist the new/migrated shape once
    syncThemeToMe({ instant: !booted });        // this device wears ME's house
    renderAll();
    syncDot('ok');
  }, err => {
    console.error('listen failed', err);
    syncDot('off');
    $('#view').innerHTML = '<div class="panel cut"><div class="panel-b"><b>Could not reach the database.</b>'
      + '<p class="muted" style="font-size:13px;">Check the Firebase config and your Firestore security rules.</p></div></div>';
  });
}

/* ---------------- economy ---------------- */
function tierInfo(points) {
  const R = ranks();
  const span = R.span || 15000, tiers = R.tiers;
  const idx = Math.max(0, Math.floor(points / span));
  const t = tiers[idx % tiers.length];
  const cycle = Math.floor(idx / tiers.length);
  const marks = R.cycles || ['', ' II', ' III', ' IV', ' V', ' VI', ' VII', ' VIII'];
  const rn = marks[clamp(cycle, 0, marks.length - 1)];
  return {
    color: t.c, name: t.n + rn, level: idx + 1,
    progress: (((points % span) + span) % span) / span,
    toNext: span - ((((points % span) + span) % span))
  };
}
function countToday(party, key) {
  const c = state.counts[party] && state.counts[party][key];
  return c && c.date === todayKey() ? c.n : 0;
}
function bump(party, key, by) {
  const day = todayKey();
  const c = state.counts[party][key];
  if (c && c.date === day) c.n = Math.max(0, c.n + by);
  else if (by > 0) state.counts[party][key] = { date: day, n: by };
}
function addHistory(party, delta, reason, key) {
  state.history.unshift({ ts: Date.now(), party, delta, reason, key });
  if (state.history.length > HISTORY_CAP) state.history.length = HISTORY_CAP;
}
/* the single point of entry for every standing change in the app */
function claim(key, party, delta, reason, opts) {
  const o = opts || {};
  state.points[party] = (state.points[party] || 0) + delta;
  bump(party, key, 1);
  addHistory(party, delta, reason, key);
  save();
  renderAll();
  if (!o.quiet) {
    toast(C('toastAwarded', { who: `<b>${esc(nameOf(party))}</b>`, what: esc(reason) }), {
      kind: delta < 0 ? 'bad' : 'good', color: OPC_FOR(party),
      amount: fmt(delta),
      undo: () => undoLast(key, party)
    });
    beep(delta < 0 ? 'down' : 'up');
    flashLead();
  }
}
function undoLast(key, party) {
  const idx = state.history.findIndex(h => h.party === party && h.key === key);
  if (idx === -1) { toast(esc(C('toastNothingToUndo')), { kind: 'warn' }); return; }
  const e = state.history[idx];
  state.points[party] = (state.points[party] || 0) - e.delta;
  bump(party, key, -1);
  state.history.splice(idx, 1);
  save();
  renderAll();
  toast(C('toastReverted', { what: esc(e.reason) }), { kind: 'warn', amount: fmt(-e.delta) });
}
function streak(party) {
  const days = new Set(state.history.filter(h => h.party === party && h.delta > 0).map(h => dayKey(h.ts)));
  let n = 0;
  const cur = new Date();
  if (!days.has(dayKey(cur))) cur.setDate(cur.getDate() - 1);   // today not logged yet is fine
  while (days.has(dayKey(cur))) { n++; cur.setDate(cur.getDate() - 1); }
  return n;
}
function totalsForRange(from, to) {
  const t = { abir: 0, jade: 0 };
  state.history.forEach(h => { if (h.ts >= from && h.ts < to && t[h.party] !== undefined) t[h.party] += h.delta; });
  return t;
}
function todayTotals() { return totalsForRange(startOfDay(Date.now()).getTime(), Date.now() + 1); }

const nodeById = id => state.nodes.find(n => n.id === id);
const planetById = id => state.planets.find(p => p.id === id);
const visibleNodes = pid => state.nodes
  .filter(n => n.p === pid)
  .filter(n => route.who === 'all' || n.o === 'both' || n.o === route.who)
  .sort((a, b) => (a.order || 0) - (b.order || 0));
function nodeLocked(node, party) {
  if (!node.req) return false;
  return countToday(party, node.req) === 0;
}

/* ---------------- toast ---------------- */
const TOAST_COLORS = { good: 'var(--ok)', bad: 'var(--penalty)', warn: 'var(--warn)', info: 'var(--info)' };
function toast(html, opts) {
  const o = opts || {};
  const wrap = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.setProperty('--tcol', o.color || TOAST_COLORS[o.kind || 'info']);

  el.innerHTML = `<div class="msg">${html}</div>${amt}`;

  const t = setTimeout(kill, o.undo ? 6500 : 3600);

/* ---------------- sound (WebAudio, no assets) ---------------- */
let actx = null;
function beep(kind) {
  if (!state.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const voice = theme().sound[kind === 'down' ? 'down' : kind === 'phase' ? 'phase' : 'up'];
    (voice.seq).forEach(([f, t]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = voice.type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(voice.gain || 0.16, actx.currentTime + t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + 0.19);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.22);
    });
  } catch (e) {}
}

/* --------------------------------------------------------------------------
   The hub scene. Each pack draws its own — a star chart, a castle tower, a
   depth sounding, a colonnade. All the core asks is that every sector is
   reachable: give the clickable group `class="hub-hit"` plus the two data
   attributes below, and the app wires the rest.
   -------------------------------------------------------------------------- */
function hubContext() {
  const places = state.planets.slice().sort((a, b) => (a.orbit || 0) - (b.orbit || 0));
  return {
    places,
    active: route.planet,
    /* every pack needs these, and none of them should reach for globals */
    name: placeName,
    count: id => state.nodes.filter(n => n.p === id).length,
    earned: id => state.history
      .filter(h => dayKey(h.ts) === todayKey() && state.nodes.some(n => n.id === h.key && n.p === id))
      .reduce((a, h) => a + h.delta, 0),
    esc,
    /* the standard hit target — keeps click wiring identical across packs */
    hit: (pl, inner, transform) =>
      `<g class="hub-hit${pl.id === route.planet ? ' on' : ''}" data-act="planet" data-p="${esc(pl.id)}"` +
      (transform ? ` transform="${transform}"` : '') + `>${inner}</g>`
  };
}
/* --------------------------------------------------------------------------
   Everything a house needs to draw the room screen itself, precomputed, so a
   theme writes markup and never reaches for a global. The wiring contract is
   the only thing the core insists on: a claim button carries data-act="claim"
   with data-id and data-p, and a room target carries data-act="planet".
   -------------------------------------------------------------------------- */
function deedData(nd) {
  const isPen = nd.pts < 0;
  const owners = nd.o === 'both' ? PARTIES : [nd.o];
  const req = nd.req ? nodeById(nd.req) : null;
  return {
    id: nd.id, name: nd.n, pts: nd.pts, type: nd.t, isPen,
    kind: nd.t === 'milestone' ? 'milestone' : isPen ? 'penalty' : 'ritual',
    typeName: nd.mt || typeName(nd.t), cad: cadName(nd.cad),
    owner: nd.o, ownerName: nd.o === 'both' ? null : nameOf(nd.o),
    req: req ? { id: req.id, name: req.n } : null,
    claims: owners.map(p => ({
      party: p, name: nameOf(p), color: OPC_FOR(p),
      n: countToday(p, nd.id), locked: !!(req && nodeLocked(nd, p))
    }))
  };
}
function roomContext() {
  const places = state.planets.slice().sort((a, b) => (a.orbit || 0) - (b.orbit || 0));
  const active = planetById(route.planet) || places[0] || null;
  if (active) route.planet = active.id;
  const nodes = active ? visibleNodes(active.id) : [];
  return {
    places, active, nodes: nodes.map(deedData),
    esc, num, fmt, C, ICON, clamp,
    name: placeName, parties: PARTIES, who: route.who,
    nameOf, opc: OPC_FOR, boardOpen: () => boardOpen,
    count: id => state.nodes.filter(n => n.p === id).length,
    earned: id => state.history
      .filter(h => dayKey(h.ts) === todayKey() && state.nodes.some(n => n.id === h.key && n.p === id))
      .reduce((a, h) => a + h.delta, 0),
    hit: (pl, inner, transform) =>
      `<g class="hub-hit${pl.id === route.planet ? ' on' : ''}" data-act="planet" data-p="${esc(pl.id)}"` +
      (transform ? ` transform="${transform}"` : '') + `>${inner}</g>`,
    /* deterministic per-id jitter, so a pinned note hangs at the same angle
       every render instead of twitching */
    jit: (seed, i) => {
      let h = 0;
      const t = String(seed) + ':' + i;
      for (let k = 0; k < t.length; k++) h = (h * 31 + t.charCodeAt(k)) | 0;
      return ((h >>> 0) % 1000) / 1000;
    }
  };
}
function hubScene() {
  const t = theme();

/* dashed connector lines between a node and the node it unlocks from */
function drawLinks() {
  const grid = $('#nodeGrid'), svg = $('#links');
  if (!grid || !svg) return;
  const gr = grid.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${gr.width} ${gr.height}`);
  svg.setAttribute('width', gr.width);
  svg.setAttribute('height', gr.height);
  const paths = [];
  $$('.node', grid).forEach(el => {
    const nd = nodeById(el.dataset.node);
    if (!nd || !nd.req) return;
    const src = $(`.node[data-node="${CSS.escape(nd.req)}"]`, grid);
    if (!src) return;
    const a = src.getBoundingClientRect(), b = el.getBoundingClientRect();
    const locked = PARTIES.some(p => nodeLocked(nd, p));
    const cls = locked ? 'locked' : '';
    let d;
    if (Math.abs(a.top - b.top) < 12) {
      /* same row — run the line between facing edges */
      const left = a.left < b.left;
      const x1 = (left ? a.right : a.left) - gr.left, x2 = (left ? b.left : b.right) - gr.left;
      const y = a.top + a.height / 2 - gr.top, mid = (x1 + x2) / 2;
      d = `M${x1},${y} C${mid},${y} ${mid},${y} ${x2},${y}`;
    } else {
      const x1 = a.left + a.width / 2 - gr.left, y1 = a.bottom - gr.top;
      const x2 = b.left + b.width / 2 - gr.left, y2 = b.top - gr.top;
      const mid = (y1 + y2) / 2;
      d = `M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`;
    }
    const t = theme();
    paths.push(typeof t.connector === 'function'
      ? t.connector({ d, locked, cls, a, b })
      : `<path class="${cls}" d="${d}"/>`);
  });
  svg.innerHTML = paths.join('');
}

const ME_KEY = 'origin_me';
let ME = (() => { try { return localStorage.getItem(ME_KEY); } catch (e) { return null; } })();
function setMe(p) { ME = p; try { localStorage.setItem(ME_KEY, p); } catch (e) {} }

const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

/* ---- one-line parser: "gym tomorrow !2000 @abir #shared *weekly" ---- */
function parseQuick(raw) {
  let s = ' ' + raw + ' ';
  const out = { pts: 0, owner: null, list: null, listNew: null, due: null, repeat: null };
  const eat = re => { const m = s.match(re); if (m) { s = s.replace(m[0], ' '); } return m; };

  let m;
  if ((m = eat(/\s!(\d+(?:\.\d+)?)(k?)\s/i))) out.pts = Math.round(parseFloat(m[1]) * (m[2] ? 1000 : 1));
  if ((m = eat(/\s@(\w+)\s/i))) {
    const w = m[1].toLowerCase();
    if (w === 'both' || w === 'us') out.owner = 'both';
    else { const hit = PARTIES.find(p => nameOf(p).toLowerCase().startsWith(w) || p.startsWith(w)); if (hit) out.owner = hit; }
  }
  if ((m = eat(/\s#([\w-]+)\s/i))) {
    const w = m[1].toLowerCase();
    const hit = state.lists.find(l => l.name.toLowerCase().replace(/\s+/g, '-').startsWith(w));
    if (hit) out.list = hit.id; else out.listNew = m[1];
  }
  if ((m = eat(/\s(?:\*(daily|weekly|monthly|weekdays)|every\s+(day|week|month|weekday|weekdays))\s/i))) {
    const w = (m[1] || m[2] || '').toLowerCase();
    out.repeat = w.startsWith('week') && w !== 'weekdays' && w !== 'weekday' ? 'weekly'
      : w.startsWith('month') ? 'monthly' : w.startsWith('weekday') ? 'weekdays' : 'daily';
  }

  const today = startOfDay(Date.now());
  const at = d => { out.due = isoDay(d); };
  if ((m = eat(/\s(\d{4})-(\d{1,2})-(\d{1,2})\s/))) at(new Date(+m[1], +m[2] - 1, +m[3]));
  else if ((m = eat(/\s(today|tod|tonight)\s/i))) at(today);
  else if ((m = eat(/\s(tomorrow|tmrw|tmr)\s/i))) { const d = new Date(today); d.setDate(d.getDate() + 1); at(d); }
  else if ((m = eat(/\sin\s+(\d+)\s*(day|days|d|week|weeks|w|month|months)\s/i))) {
    const d = new Date(today), n = +m[1], u = m[2][0].toLowerCase();
    d.setDate(d.getDate() + (u === 'w' ? n * 7 : u === 'm' ? 0 : n));
    if (u === 'm') d.setMonth(d.getMonth() + n);
    at(d);
  } else if ((m = eat(/\snext\s+(week|month)\s/i))) {
    const d = new Date(today);
    if (m[1].toLowerCase() === 'week') d.setDate(d.getDate() + 7); else d.setMonth(d.getMonth() + 1);
    at(d);
  } else if ((m = eat(new RegExp('\\s(' + MONTHS.join('|') + ')[a-z]*\\s+(\\d{1,2})\\s', 'i')))) {
    const d = new Date(today.getFullYear(), MONTHS.indexOf(m[1].toLowerCase()), +m[2]);
    if (d < today) d.setFullYear(d.getFullYear() + 1);
    at(d);
  } else if ((m = eat(new RegExp('\\s(\\d{1,2})\\s+(' + MONTHS.join('|') + ')[a-z]*\\s', 'i')))) {
    const d = new Date(today.getFullYear(), MONTHS.indexOf(m[2].toLowerCase()), +m[1]);
    if (d < today) d.setFullYear(d.getFullYear() + 1);
    at(d);
  } else if ((m = eat(/\s(?:on\s+)?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|nesday|rsday|urday)?\s/i))) {
    const want = { sun: 0, mon: 1, tue: 2, tues: 2, wed: 3, thu: 4, thur: 4, thurs: 4, fri: 5, sat: 6 }[m[1].toLowerCase()];
    const d = new Date(today);
    let add = (want - d.getDay() + 7) % 7; if (add === 0) add = 7;
    d.setDate(d.getDate() + add);
    at(d);
  }
  out.text = s.replace(/\s+/g, ' ').trim();
  return out;
}

function quickPreview(raw) {

function tasksInScope() {
  let t = state.tasks.slice();
  if (route.list === 'today') {
    const end = startOfDay(Date.now()).getTime() + 86400000;
    t = t.filter(x => x.due && startOfDay(x.due).getTime() < end);
  } else if (route.list !== 'all') t = t.filter(x => x.list === route.list);
  return t;
}
function taskGroups(list) {
  const t0 = startOfDay(Date.now()).getTime();
  const g = { over: [], today: [], tmr: [], week: [], later: [], none: [], done: [] };
  list.forEach(t => {
    if (t.done) { g.done.push(t); return; }
    if (!t.due) { g.none.push(t); return; }
    const d = startOfDay(t.due).getTime();
    if (d < t0) g.over.push(t);
    else if (d === t0) g.today.push(t);
    else if (d === t0 + 86400000) g.tmr.push(t);
    else if (d < t0 + 7 * 86400000) g.week.push(t);
    else g.later.push(t);
  });
  const bydue = (a, b) => (startOfDay(a.due) - startOfDay(b.due)) || (a.order || 0) - (b.order || 0);
  ['over', 'today', 'tmr', 'week', 'later'].forEach(k => g[k].sort(bydue));
  g.none.sort((a, b) => (a.order || 0) - (b.order || 0));
  g.done.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  return g;
}

/* ---------------- task actions ---------------- */
const taskById = id => state.tasks.find(t => t.id === id);

function advanceDue(iso, repeat) {
  const d = iso ? dayDate(iso) : startOfDay(Date.now());
  if (repeat === 'daily') d.setDate(d.getDate() + 1);
  else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
  else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
  else if (repeat === 'weekdays') { do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6); }
  return isoDay(d);
}
function toggleTask(id) {
  const t = taskById(id); if (!t) return;
  if (t.done) {
    t.done = false; t.doneAt = null;
    if (t.pts) undoLast('task:' + t.id, t.claimedBy || t.o);
    t.claimedBy = null;
    save(); renderAll();
    return;
  }
  const who = (t.o && t.o !== 'both') ? t.o : (ME || 'abir');
  if (t.repeat) {
    /* repeating tasks roll forward instead of piling up in Completed */
    const next = advanceDue(t.due, t.repeat);
    if (t.pts) claim('task:' + t.id, who, t.pts, t.text);
    else toast(`${ICON('check', 12)} ${esc(t.text)} → next ${esc(dueLabel(next).txt)}`, { kind: 'good' });
    t.due = next;
    save(); renderAll();
    return;
  }
  t.done = true; t.doneAt = Date.now(); t.claimedBy = who;
  if (t.pts) claim('task:' + t.id, who, t.pts, t.text);
  else toast(`${ICON('check', 12)} ${esc(t.text)}`, { kind: 'good', undo: () => { t.done = false; t.doneAt = null; save(); renderAll(); } });
  save(); renderAll();
}
function inlineEdit(id) {
  const row = $(`.tk[data-task="${CSS.escape(id)}"] .tk-text`);
  const t = taskById(id);
  if (!row || !t) return;
  const inp = document.createElement('input');
  inp.className = 'tk-edit'; inp.value = t.text;
  row.replaceWith(inp);
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  const commit = ok => {
    if (ok && inp.value.trim() && inp.value.trim() !== t.text) { t.text = inp.value.trim(); save(); }
    renderAll();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    if (e.key === 'Escape') { e.preventDefault(); commit(false); }
  });
  inp.addEventListener('blur', () => commit(true));
}

/* ==========================================================================
   FOCUS — a real 50/10 timer wired into the economy
   ========================================================================== */
const FOCUS_NODE = 'daily:pomodoro';
function focusOf(p) {
  const f = state.focus[p] || {};
  if (f.day && f.day !== todayKey()) { f.cycles = 0; f.day = todayKey(); }
  return f;
}
function focusLeft(f) {
  if (!f.endsAt) return 0;
  return f.running ? Math.max(0, f.endsAt - Date.now()) : (f.left || 0);
}
function focusTotal(f) {
  const s = state.settings;
  return ((f.phase === 'break' ? s.brk : f.phase === 'long' ? s.longBrk : s.work) || 50) * 60000;
}
function startFocus(p, phase) {
  const s = state.settings;
  const mins = phase === 'break' ? s.brk : phase === 'long' ? s.longBrk : s.work;
  state.focus[p] = { phase: phase || 'work', running: true, endsAt: Date.now() + mins * 60000,
    left: 0, cycles: (focusOf(p).cycles || 0), day: todayKey(), by: p };
  save(); renderAll();
}
function pauseFocus(p) {
  const f = focusOf(p); if (!f.running) return;
  f.left = focusLeft(f); f.running = false; f.endsAt = null;
  state.focus[p] = f; save(); renderAll();
}
function resumeFocus(p) {
  const f = focusOf(p); if (f.running || !f.left) return;
  f.running = true; f.endsAt = Date.now() + f.left; f.left = 0;
  state.focus[p] = f; save(); renderAll();
}
function stopFocus(p) { state.focus[p] = { cycles: focusOf(p).cycles || 0, day: todayKey() }; save(); renderAll(); }
function completePhase(p) {
  const f = focusOf(p);
  const s = state.settings;
  if (f.phase === 'work') {
    f.cycles = (f.cycles || 0) + 1; f.day = todayKey();
    state.focus[p] = f;
    const node = nodeById(FOCUS_NODE);
    if (s.autoClaimFocus && node) claim(node.id, p, node.pts, node.n);
    else { toast(`<b>${esc(nameOf(p))}</b> · focus block done`, { kind: 'good' }); beep('phase'); }
    notify(nameOf(p) + ': focus block complete', `${s.brk} minute break.`);
    const longNow = s.longEvery > 0 && f.cycles % s.longEvery === 0;
    startFocus(p, longNow ? 'long' : 'break');
  } else {
    beep('phase');
    notify(nameOf(p) + ': break over', 'Back to it.');
    stopFocus(p);
    toast(`<b>${esc(nameOf(p))}</b> · break over`, { kind: 'info' });
  }
}
function notify(title, body) {
  try {
    if (window.Notification && Notification.permission === 'granted') new Notification(title, { body, silent: false });
  } catch (e) {}
}
function focusTick() {
  PARTIES.forEach(p => {
    const f = focusOf(p);
    if (f.running && f.endsAt && Date.now() >= f.endsAt) completePhase(p);
  });
  paintFocus();
}
const mmss = ms => {
  const t = Math.max(0, Math.round(ms / 1000));
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
};
/* light repaint every second — never a re-render, never a database write */
function paintFocus() {
  PARTIES.forEach(p => {
    const f = focusOf(p);
    const left = focusLeft(f);
    const tot = focusTotal(f) || 1;
    $$(`[data-focus-time="${p}"]`).forEach(el => { el.textContent = f.endsAt || f.left ? mmss(left) : mmss(focusTotal({ phase: 'work' })); });
    $$(`[data-focus-ring="${p}"]`).forEach(el => {
      const circ = 2 * Math.PI * 45;
      el.setAttribute('stroke-dasharray', circ);
      el.setAttribute('stroke-dashoffset', (circ * (1 - clamp(left / tot, 0, 1))).toFixed(1));
    });
  });
}
function focusPhaseColor(f) {
  return f.phase === 'work' ? 'var(--focus-work)' : f.phase === 'long' ? 'var(--focus-long)' : 'var(--focus-break)';
}

function renderFocus() {
  const me = ME || 'abir';
  const f = focusOf(me);
  const s = state.settings;
  const col = focusPhaseColor(f);
  const active = !!(f.endsAt || f.left);
  const phase = f.phase === 'break' ? 'Break' : f.phase === 'long' ? 'Long break' : C('focus');
  const node = nodeById(FOCUS_NODE);
  const others = PARTIES.filter(p => p !== me).map(p => {
    const g = focusOf(p);
    if (!g.running) return `<div class="chip">${esc(nameOf(p))} · idle · ${g.cycles || 0} today</div>`;
    return `<div class="chip" style="border-color:${OPC_FOR(p)};color:${OPC_FOR(p)}">${esc(nameOf(p))} · ${g.phase === 'work' ? 'in a block' : 'on break'} · <span data-focus-time="${p}">--:--</span></div>`;
  }).join('');

  return `
    <div class="panel cut"><div class="panel-h">
      <span class="t">${esc(C('focus'))}</span>
      <span class="row">${others}<button class="btn icon" data-act="focus-settings" title="Timer settings">${ICON('settings', 14)}</button></span>
    </div>
    <div class="panel-b">
      <div class="focus-wrap" style="--fc:${col}">
        <div class="focus-ring">
          <svg viewBox="0 0 100 100">
            <circle class="bg" cx="50" cy="50" r="45"/>
            <circle class="fg" cx="50" cy="50" r="45" data-focus-ring="${me}"/>
          </svg>
          <div class="focus-mid">
            <div class="focus-time mono" data-focus-time="${me}">${mmss(active ? focusLeft(f) : s.work * 60000)}</div>
            <div class="focus-phase">${esc(active ? phase : 'Ready')}</div>
            <div class="focus-cyc">${f.cycles || 0} block${(f.cycles || 0) === 1 ? '' : 's'} today · ${s.work}/${s.brk}</div>
          </div>
        </div>
        <div class="row" style="justify-content:center;margin-top:6px;">
          ${!active ? `<button class="btn pri" data-act="focus-start" data-p="${me}">Begin focus block</button>` : ''}
          ${active && f.running ? `<button class="btn" data-act="focus-pause" data-p="${me}">Pause</button>` : ''}
          ${active && !f.running ? `<button class="btn pri" data-act="focus-resume" data-p="${me}">Resume</button>` : ''}
          ${active ? `<button class="btn" data-act="focus-skip" data-p="${me}">Skip phase</button>` : ''}
          ${active ? `<button class="btn warn" data-act="focus-stop" data-p="${me}">Abort</button>` : ''}
        </div>
        <div class="eyebrow" style="text-align:center;margin-top:10px;max-width:420px;line-height:1.7;">
          ${node && s.autoClaimFocus
            ? `Finishing a block ${esc(C('scoreVerb').toLowerCase())}s <b style="color:var(--accent)">${esc(node.n)}</b> · ${fmt(node.pts)} for ${esc(nameOf(me))}`
            : `Auto-${esc(C('scoreVerb').toLowerCase())} is off — finishing a block just rings.`}
          <br>This device is <b style="color:${OPC_FOR(me)}">${esc(nameOf(me))}</b> ·
          <button class="btn sm" data-act="switch-me" style="margin-top:6px;">Change ${esc(C('person').toLowerCase())}</button>
        </div>
      </div>
    </div></div>`;
}

function marketCard(item) {

    </div>
    ${free ? '' : `<div class="mk-bar"><i style="width:${pct}%"></i></div>`}
    <div class="row">

async function newBet() {
  const v = await formBox('New wager', [
    { k: 'title', label: "What's the bet?", ph: 'Loser does the dishes for a week' },
    { k: 'stake', label: 'Stake in ' + C('score').toLowerCase(), type: 'number', value: 5000 },

  ], 'Open wager');

  if (stake <= 0) { toast('Give it a stake.', { kind: 'warn' }); return; }

function resolveBet(id, winner) {
  const b = state.bets.find(x => x.id === id); if (!b || b.status !== 'open') return;
  b.status = 'resolved'; b.winner = winner;
  claim('bet:' + id, winner, b.stake, 'Wager won: ' + b.title, { quiet: true });
  claim('bet:' + id, other(winner), -b.stake, 'Wager lost: ' + b.title, { quiet: true });
  if (b.recurring) state.bets.unshift({ id: uid('bet'), title: b.title, stake: b.stake, status: 'open', recurring: true, ts: Date.now() });
  save(); renderAll();
  toast(`<b style="color:${OPC_FOR(winner)}">${esc(nameOf(winner))}</b> takes “${esc(b.title)}”`, { kind: 'good', amount: fmt(b.stake), color: OPC_FOR(winner) });
  beep('phase'); confetti(OPC_FOR(winner));
}
async function revertBet(id) {
  const b = state.bets.find(x => x.id === id); if (!b || b.status !== 'resolved') return;
  const ok = await confirmBox('Revert this result?', 'The ' + C('score').toLowerCase() + ' transfer is undone and the wager is deleted entirely.', 'Revert', true);
  if (!ok) return;
  state.points[b.winner] -= b.stake;
  state.points[other(b.winner)] += b.stake;
  state.history = state.history.filter(h => h.key !== 'bet:' + id);
  PARTIES.forEach(p => { delete state.counts[p]['bet:' + id]; });
  state.bets = state.bets.filter(x => x.id !== id);
  save(); renderAll();
}
function confetti(color) {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden;';
  document.body.appendChild(box);
  const pal = [color].concat(theme().confetti);
  for (let i = 0; i < 70; i++) {
    const d = document.createElement('div');
    const w = 5 + Math.random() * 6;
    d.style.cssText = `position:absolute;top:-20px;left:${Math.random() * 100}vw;width:${w}px;height:${w * 0.5}px;`
      + `background:${pal[i % pal.length]};opacity:.95;transform:rotate(${Math.random() * 360}deg);`
      + `animation:fall ${2 + Math.random() * 1.6}s cubic-bezier(.25,.46,.45,.94) ${Math.random() * .4}s forwards;`;
    box.appendChild(d);
  }
  setTimeout(() => box.remove(), 4200);
}

/* ==========================================================================
   CODEX — log + season analytics
   ========================================================================== */
function raceChart() {
  const DAYS_BACK = 14;
  const t0 = startOfDay(Date.now()).getTime() - (DAYS_BACK - 1) * 86400000;
  const days = [];
  for (let i = 0; i < DAYS_BACK; i++) days.push(t0 + i * 86400000);
  /* walk backwards from current totals to reconstruct the daily curve */
  const series = {};
  PARTIES.forEach(p => {
    const vals = new Array(DAYS_BACK).fill(0);
    let running = state.points[p] || 0;
    for (let i = DAYS_BACK - 1; i >= 0; i--) {
      vals[i] = running;
      const dayDelta = state.history
        .filter(h => h.party === p && h.ts >= days[i] && h.ts < days[i] + 86400000)
        .reduce((a, h) => a + h.delta, 0);
      running -= dayDelta;
    }
    series[p] = vals;
  });
  const all = series.abir.concat(series.jade);
  const min = Math.min.apply(null, all), max = Math.max.apply(null, all);
  const span = Math.max(1, max - min);
  const W = 620, H = 200, pad = 14;
  const x = i => pad + (i * (W - pad * 2)) / (DAYS_BACK - 1);
  const y = v => H - pad - ((v - min) / span) * (H - pad * 2);
  const line = p => series[p].map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const dots = p => series[p].map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" fill="${OPC_FOR(p)}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:220px;height:auto;display:block;margin:0 auto;">
    ${PARTIES.map(p => `<path d="${line(p)}" fill="none" stroke="${OPC_FOR(p)}" stroke-width="2.2"
       stroke-linejoin="round" style="filter:drop-shadow(0 0 4px ${OPC_FOR(p)}88)"/>${dots(p)}`).join('')}
  </svg>
  <div class="row" style="justify-content:center;gap:16px;margin-top:6px;">
    ${PARTIES.map(p => `<span class="eyebrow" style="color:${OPC_FOR(p)}">${esc(nameOf(p))}</span>`).join('')}
    <span class="eyebrow">last ${DAYS_BACK} days</span>
  </div>`;
}
function planetBreakdown() {
  const from = weekStart().getTime();
  const rows = state.planets.map(pl => {
    const ids = new Set(state.nodes.filter(n => n.p === pl.id).map(n => n.id));
    const tot = {};
    PARTIES.forEach(p => {
      tot[p] = state.history.filter(h => h.party === p && h.ts >= from && ids.has(h.key)).reduce((a, h) => a + h.delta, 0);
    });
    return { pl, tot, sum: Math.abs(tot.abir) + Math.abs(tot.jade) };
  }).filter(r => r.sum > 0).sort((a, b) => b.sum - a.sum);
  if (!rows.length) return '<div class="empty">Nothing logged this week yet.</div>';
  const max = Math.max.apply(null, rows.map(r => r.sum));
  return rows.map(r => `<div style="margin-bottom:11px;">
    <div class="row" style="justify-content:space-between;font-size:12.5px;">
      <span style="color:${esc(r.pl.color)}">${esc(r.pl.name)}</span>
      <span class="mono muted">${PARTIES.map(p => fmt(r.tot[p])).join(' / ')}</span>
    </div>
    <div class="mk-bar" style="margin-top:4px;display:flex;background:rgba(0,0,0,.5);">
      ${PARTIES.map(p => `<i style="width:${(Math.abs(r.tot[p]) / max * 100).toFixed(1)}%;background:${OPC_FOR(p)};box-shadow:none;"></i>`).join('')}
    </div>
  </div>`).join('');
}

    PARTIES.forEach(p => {

        ${PARTIES.map(p => `<div class="stat"><div class="v">${streak(p)}</div><div class="l">${esc(nameOf(p))} day streak</div></div>`).join('')}

        <div class="row mono muted" style="gap:18px;margin-top:6px;font-size:12px;">
          ${PARTIES.map(p => `<span>${esc(nameOf(p))}: ${fmt(lastW[p])}</span>`).join('')}
        </div>
      </div></div>
      <div class="sect-title">Where the ${esc(C('score').toLowerCase())} came from · this week</div>

      <div class="row">
        <button class="btn" data-act="export">Export log (CSV)</button>
        <button class="btn" data-act="season-edit">Rename ${esc(C('season').toLowerCase())}</button>
        <button class="btn warn" data-act="season-end">End ${esc(C('season').toLowerCase())} &amp; start the next</button>
      </div>
      ${state.archive.length ? `<div class="sect-title">Past ${esc(C('season').toLowerCase())}s</div>` + state.archive.map(a => `
        <div class="log-row"><div><div>${esc(C('season'))} ${a.n} · ${esc(a.name || '')}</div>
        <div class="log-meta">${new Date(a.ended).toLocaleDateString()} · ${PARTIES.map(p => esc(nameOf(p)) + ' ' + num(a.points[p] || 0)).join(' · ')}</div></div>
        <div class="log-d" style="color:${a.winner ? OPC_FOR(a.winner) : 'var(--txt-3)'}">${a.winner ? ICON('lead', 11) + ' ' + esc(nameOf(a.winner)) : 'tie'}</div></div>`).join('') : ''}`;
  }

  const filt = ['all'].concat(PARTIES).map(w =>
    `<button class="btn sm${route.logWho === w ? ' on' : ''}" data-act="log-who" data-w="${w}">${w === 'all' ? 'Everyone' : esc(nameOf(w))}</button>`).join('');
  const rows = state.history.filter(h => route.logWho === 'all' || h.party === route.logWho);

    ${shown.length ? shown.map(h => {
      const d = new Date(h.ts);

        <div class="log-d ${h.delta > 0 ? 'pos' : h.delta < 0 ? 'neg' : ''}">${fmt(h.delta)}</div>
      </div>`;
    }).join('') : `<div class="empty">${esc(C('emptyLog'))}</div>`}
    ${rows.length > shown.length ? `<div style="margin-top:12px;"><button class="btn" data-act="log-more">Show more</button></div>` : ''}`;
}

async function endSeason() {
  const ok = await confirmBox('End ' + C('season').toLowerCase() + ' ' + state.season.n + '?',

  if (!ok) return;
  const winner = state.points.abir === state.points.jade ? null : (state.points.abir > state.points.jade ? 'abir' : 'jade');
  state.archive.unshift({ n: state.season.n, name: state.season.name, started: state.season.started,
