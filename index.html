  if (state.comms.length > 120) state.comms.length = 120;
  el.value = '';
  save(); renderAll();
}

/* ==========================================================================
   RENDER ROOT
   ========================================================================== */
function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.id || !(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return null;
  return { id: el.id, val: el.value, pos: el.selectionStart };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  el.value = f.val;
  el.focus();
  try { el.setSelectionRange(f.pos, f.pos); } catch (e) {}
}
function renderView() {
  const v = route.view;
  const th0 = theme();
  const inRoom = v === 'chart' && (
    !!(th0.diorama && th0.diorama[route.planet]) ||
    !!(th0.panorama && th0.panorama[route.planet] && window.ORIGIN_PANO &&
       window.ORIGIN_PANO.ready && !window.ORIGIN_PANO.failed));
  document.getElementById('main').classList.toggle('in-room', inRoom);
  document.body.classList.toggle('in-room', inRoom);
  $('#view').innerHTML =
    v === 'chart' ? renderChart() :
    v === 'foundry' ? renderFoundry() :
    v === 'focus' ? renderFocus() :
    v === 'market' ? renderMarket() :
    v === 'conclave' ? renderConclave() :
    renderCodex();
}
let renderQueued = false;
function renderAll() {
  if (!booted) return;
  const f = captureFocus();
  renderHud();
  renderNav();
  renderView();
  renderAside();
  restoreFocus(f);
  requestAnimationFrame(() => {
    drawLinks(); paintFocus();
    /* the room screen may be a place you stand in rather than a picture you
       look at; the house wires that up once its markup is in the document */
    const th = theme();
    if (route.view === 'chart' && typeof th.afterRoom === 'function') {
      try { th.afterRoom(roomContext()); } catch (e) { console.error('afterRoom failed', e); }
    } else if (window.ORIGIN_PANO && window.ORIGIN_PANO.ok) {
      window.ORIGIN_PANO.unmount();
    }
  });
}
function go(view) {
  route.view = view;
  renderAll();
  if (view === 'foundry') setTimeout(() => { const q = $('#quickAdd'); if (q && window.innerWidth > 760) q.focus(); }, 20);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ==========================================================================
   COMMAND PALETTE
   ========================================================================== */
let palItems = [], palSel = 0;
function buildPalette() {
  const items = [];
  ['chart', 'foundry', 'focus', 'market', 'conclave', 'codex'].forEach(v =>
    items.push({ t: C(VIEW_COPY[v]), s: C(VIEW_COPY[v] + 'Fn') || 'screen', c: 'var(--accent)', run: () => go(v) }));
  THEME_IDS.forEach(id => items.push({
    t: REG.list[id].name, s: REG.list[id].tagline, c: REG.list[id].tokens.accent,
    run: () => chooseTheme(id, { instant: true })
  }));
  state.planets.forEach(p => items.push({
    t: placeName(p), s: (p.sub || ''), c: p.color,
    run: () => { route.planet = p.id; go('chart'); }
  }));
  state.nodes.forEach(n => {
    const owners = n.o === 'both' ? PARTIES : [n.o];
    owners.forEach(p => items.push({
      t: n.n, s: `claim for ${nameOf(p)} · ${fmt(n.pts)}`, c: OPC_FOR(p),
      run: () => { if (nodeLocked(n, p)) toast(esc(C('toastLocked', { item: (nodeById(n.req) || {}).n || '' })), { kind: 'warn' }); else claim(n.id, p, n.pts, n.n); }
    }));
  });
  state.tasks.filter(t => !t.done).forEach(t => items.push({
    t: t.text, s: 'task · complete it', c: 'var(--gold)', run: () => toggleTask(t.id)
  }));
  state.shop.forEach(i => items.push({
    t: i.n, s: `redeem for ${nameOf(i.o)} · ${i.pts ? num(i.pts) : 'free'}`, c: OPC_FOR(i.o), run: () => { go('market'); redeem(i.id); }
  }));
  return items;
}
function openPalette() {
  palItems = buildPalette(); palSel = 0;
  $('#palWrap').classList.add('on');
  const i = $('#palInput'); i.value = ''; i.focus();
  paintPalette('');
}
function closePalette() { $('#palWrap').classList.remove('on'); }
function paintPalette(q) {
  const ql = q.trim().toLowerCase();
  const hits = (ql ? palItems.filter(it => (it.t + ' ' + it.s).toLowerCase().includes(ql)) : palItems).slice(0, 40);
  palSel = clamp(palSel, 0, Math.max(0, hits.length - 1));
  $('#palList').innerHTML = hits.map((it, i) => `<div class="pal-item${i === palSel ? ' sel' : ''}" data-i="${i}">
    <span class="dot" style="background:${it.c}"></span>
    <span class="grow" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(it.t)}</span>
    <span class="k">${esc(it.s)}</span></div>`).join('') || '<div class="empty" style="padding:14px;">No match.</div>';
  $('#palList').__hits = hits;
}
function runPalette(i) {
  const hits = $('#palList').__hits || [];
  const it = hits[i];
  closePalette();
  if (it) setTimeout(it.run, 10);
}

/* ==========================================================================
   THE SORTING
   --------------------------------------------------------------------------
   One screen, four cards. Each card is painted from its own house's tokens
   and set in its own display face, so the choice is visible rather than
   described — you are looking at the thing you are picking. Origin System is
   offered underneath rather than as a fifth card, because the brief for this
   screen is four houses and four cards is what fits a phone without
   scrolling.
   ========================================================================== */
const HOUSES = ['gryffindor', 'slytherin', 'ravenclaw', 'hufflepuff'];
const houseIds = () => HOUSES.filter(id => REG.list[id]);
const otherIds = () => THEME_IDS.filter(id => HOUSES.indexOf(id) < 0);

/* The cards show four typefaces at once, so they need four font families that
   the active theme's own link does not carry. Built once from the packs. */
let pickerFontLoaded = false;
function loadPickerFonts() {
  if (pickerFontLoaded) return;
  const fams = [];
  THEME_IDS.forEach(id => {
    const f = REG.list[id].fonts;
    [f.display, f.body].forEach(n => { if (n && fams.indexOf(n) < 0) fams.push(n); });
  });
  const href = 'https://fonts.googleapis.com/css2?' +
    fams.map(n => 'family=' + n.replace(/ /g, '+') + ':wght@400;600;700').join('&') +
    '&display=swap';
  const el = $('#pickerFont');
  if (el) { el.href = href; pickerFontLoaded = true; }
}

let ceremonyOpen = false;
/* first === the sorting proper; otherwise it is the same screen used as a
   switcher, which is why the copy is the only thing that differs */
function openCeremony(first) {
  loadPickerFonts();
  const them = other(ME || 'abir');
  const theirs = REG.list[themeFor(them)];
  const mine = themeFor(ME);

  const card = id => {
    const t = REG.list[id], k = t.tokens;
    /* Every value on this card is that house's own token. The card is a
       working miniature of the house — its ground, its metal, its typefaces,
       its corner language, its word for a deed and its verb for scoring it. */
    const vars = [
      '--ch-bg:' + k.void, '--ch-surface:' + k.surface, '--ch-line:' + k.line,
      '--ch-txt:' + k.txt, '--ch-txt2:' + k['txt-2'],
      '--ch-accent:' + k.accent, '--ch-on:' + k['on-accent'],
      '--ch-mark:' + k.milestone, '--ch-track:' + k.track,
      '--ch-radius:' + k['radius-lg'], '--ch-btnr:' + k['chip-radius'],
      '--ch-clip:' + k['panel-clip'],
      '--ch-fdisp:' + k['f-display'], '--ch-fbody:' + k['f-body'],
      '--ch-fmono:' + k['f-mono'], '--ch-flabel:' + k['f-label'],
      '--ch-tt:' + k['tt-display'], '--ch-ls:' + k['ls-display'],
      '--ch-ttlabel:' + k['tt-label'], '--ch-lslabel:' + k['ls-label']
    ].join(';');
    const mark = t.icons.markMilestone.replace('<svg', '<svg width="12" height="12"');
    return `<button class="cer-card${id === mine ? ' chosen' : ''}" data-act="house-pick"
        data-t="${esc(id)}" style="${esc(vars)}"
        aria-label="${esc(t.name)}: ${esc(t.tagline)}">
      <span class="cer-tex" style="background:${esc(t.texture)}"></span>
      <span class="cer-body">
        <span class="cer-crest">${t.icons.crest}</span>
        <span class="cer-name">${esc(t.name)}</span>
        <span class="cer-tag">${esc(t.tagline)}</span>
        <span class="cer-prev">
          <span class="cer-panel">
            <span class="ttl">${esc(t.copy.group)}</span>
            <span class="cer-row">
              <span class="cer-mk">${mark}</span>
              <span class="nm">${esc(t.copy.typeMilestone)}</span>
              <span class="vl">+5,000</span>
            </span>
            <span class="cer-bar"><i></i></span>
          </span>
          <span class="cer-act">
            <span class="b">${esc(t.copy.scoreVerb)}</span>
            <span class="g">${esc(t.copy.score)}</span>
          </span>
        </span>
      </span>
    </button>`;
  };

  const rest = otherIds().map(id => {
    const t = REG.list[id];
    return `<button data-act="house-pick" data-t="${esc(id)}">${esc(t.name)}</button>`;
  }).join('<span class="cer-sep">·</span>');

  $('#ceremony').innerHTML = `
    <div class="cer-head">
      <div class="k">${first ? 'The Sorting' : 'Change house'}</div>
      <h2>${first ? 'Where do you belong?' : 'Pick a different house'}</h2>
      <p>${first
        ? 'This one is yours alone. It follows you to every device you sign in on, and it does not change what '
          + esc(nameOf(them)) + ' sees.'
        : 'Yours alone — ' + esc(nameOf(them)) + ' keeps '
          + (theirs ? esc(theirs.name) : 'whatever they chose') + '.'}</p>
    </div>
    <div class="cer-grid">${houseIds().map(card).join('')}</div>
    <div class="cer-foot">
      ${rest}
      ${first ? '' : '<span class="cer-sep"> · </span><button data-act="cer-close">Cancel</button>'}
    </div>`;
  $('#ceremony').classList.add('on');
  document.body.classList.add('sorting');
  ceremonyOpen = true;
  setTimeout(() => { const b = $('#ceremony .cer-card'); if (b) b.focus(); }, 40);
}
function closeCeremony() {
  $('#ceremony').classList.remove('on');
  document.body.classList.remove('sorting');
  ceremonyOpen = false;
}
/* Choosing is the only ceremonial beat: the chosen card holds, the rest fall
   back, and then the app is already in that house behind the screen. */
function chooseTheme(id, opts) {
  if (!REG.list[id]) return;
  const o = opts || {};
  if (ME) {
    state.themes = state.themes || {};
    state.themes[ME] = id;
    save();
  }
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if (!ceremonyOpen || reduce || o.instant) {
    closeCeremony();
    applyTheme(id, o.instant ? { instant: true } : undefined);
    return;
  }
  $$('#ceremony .cer-card').forEach(c => {
    c.classList.toggle('chosen', c.dataset.t === id);
    c.classList.toggle('dim', c.dataset.t !== id);
  });
  setTimeout(() => { applyTheme(id, { instant: true }); }, 260);
  setTimeout(closeCeremony, 460);
}

  'dio-home': () => window.ORIGIN_DIO && window.ORIGIN_DIO.home(),

document.addEventListener('click', e => {
  const navBtn = e.target.closest('#nav .nav-btn');
  if (navBtn) { go(navBtn.dataset.nav); return; }
  const palRow = e.target.closest('.pal-item');
  if (palRow) { runPalette(+palRow.dataset.i); return; }
  if (e.target.id === 'modalWrap') { closeModal(null); return; }
  if (e.target.id === 'palWrap') { closePalette(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.closest('.pano-fx') && window.ORIGIN_PANO && window.ORIGIN_PANO.wasDrag()) return;
  if (el.closest('.dio-pins') && window.ORIGIN_DIO && window.ORIGIN_DIO.wasDrag()) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el);
});

document.addEventListener('input', e => {
  if (e.target.id === 'quickAdd') $('#quickPrev').innerHTML = quickPreview(e.target.value);
  if (e.target.id === 'palInput') { palSel = 0; paintPalette(e.target.value); }
});

document.addEventListener('keydown', e => {
  /* palette navigation */
  if ($('#palWrap').classList.contains('on')) {
    const hits = ($('#palList').__hits || []).length;
    if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = clamp(palSel + 1, 0, hits - 1); paintPalette($('#palInput').value); }
    if (e.key === 'ArrowUp') { e.preventDefault(); palSel = clamp(palSel - 1, 0, hits - 1); paintPalette($('#palInput').value); }
    if (e.key === 'Enter') { e.preventDefault(); runPalette(palSel); }
    return;
  }
  if (ceremonyOpen) {
    /* the first sorting has no exit: you have to pick one */
    if (e.key === 'Escape' && $('#ceremony [data-act="cer-close"]')) { e.preventDefault(); closeCeremony(); }
    return;
  }
  if ($('#modalWrap').classList.contains('on')) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(null); }
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
      const submit = $('#modal [data-act="modal-submit"]') || $('#modal [data-act="modal-ok"]');
      if (submit) { e.preventDefault(); submit.click(); }
    }
    return;
  }
  if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openPalette(); return; }

  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (typing) {
    if (e.target.id === 'quickAdd' && e.key === 'Enter') {
      e.preventDefault();
      if (addQuick(e.target.value)) {
        const q = $('#quickAdd'); if (q) { q.value = ''; q.focus(); $('#quickPrev').innerHTML = ''; }
      }
    }
    if (e.target.id === 'commInput' && e.key === 'Enter') { e.preventDefault(); addComm(); const c = $('#commInput'); if (c) c.focus(); }
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  const map = { 1: 'chart', 2: 'foundry', 3: 'focus', 4: 'market', 5: 'conclave', 6: 'codex' };
  if (map[e.key]) { go(map[e.key]); return; }
  if (e.key === 'k' || e.key === '/') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'n') {
    e.preventDefault();
    if (route.view !== 'foundry') go('foundry');
    setTimeout(() => { const q = $('#quickAdd'); if (q) q.focus(); }, 40);
  }
});

window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(drawLinks, 120); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { focusTick(); renderAll(); } });

/* ==========================================================================
   INIT
   ========================================================================== */
/* First paint uses whatever the pre-paint stamp cached, or the first
   registered theme; the moment the document arrives, syncThemeToMe() moves
   us to the house this operator actually wears. */
applyTheme((() => {
  try { const c = JSON.parse(localStorage.getItem('origin_theme_paint') || 'null');
        if (c && REG.list[c.id]) return c.id; } catch (e) {}
  return THEME_IDS[0];
})(), { first: true });
subscribe();
/* fetch the panorama renderer in the background; the room screen re-renders
   itself once it is there, and carries on regardless if it never arrives */
if (window.ORIGIN_PANO) window.ORIGIN_PANO.load().then(ok => {
  if (!ok) return;
  /* the first snapshot may not have landed yet; step in as soon as it has */
  const t = setInterval(() => { if (booted) { clearInterval(t); renderAll(); } }, 120);
  setTimeout(() => clearInterval(t), 15000);
});
setInterval(focusTick, 1000);
/* keep relative timestamps and day rollovers honest, but never while typing */
setInterval(() => {
  const t = document.activeElement;
  if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName)) return;
  if ($('#modalWrap').classList.contains('on') || $('#palWrap').classList.contains('on')) return;
  renderAll();
}, 60000);
setTimeout(() => { if (!ME) askWhoAmI(); else if (!themeFor(ME)) openCeremony(true); }, 900);
if (window.__signOut) show($('#signOutBtn'), true);
if (window.__userEmail) $('#signOutBtn').title = 'Signed in as ' + window.__userEmail + ' — sign out';

window.__origin = { get state() { return state; }, route, go, save, claim, toast,
  themes: REG.list, applyTheme, chooseTheme, C, ICON,
  get theme() { return THEME; } };
} /* end startApp */
</script>
